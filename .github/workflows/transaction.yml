name: EvoHime — transaction module
on:
  push:
    branches: [main]
    paths: ['crates/evohime-updater/**', 'release-versions/transaction.txt', '.github/workflows/transaction.yml', '.github/workflows/module-native.yml']
  pull_request:
    paths: ['crates/evohime-updater/**', 'release-versions/transaction.txt', '.github/workflows/transaction.yml', '.github/workflows/module-native.yml']
jobs:
  module:
    uses: ./.github/workflows/module-native.yml
    with: { module: transaction, package: evohime-updater, artifact: evohime-transaction.exe, version-file: release-versions/transaction.txt }
