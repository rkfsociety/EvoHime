name: transaction module
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ['crates/evohime-updater/**', 'release-versions/transaction.txt', '.github/workflows/transaction.yml', '.github/workflows/module-native.yml']

concurrency:
  group: evohime-module-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  module:
    uses: ./.github/workflows/module-native.yml
    permissions: { contents: write }
    with: { module: transaction, package: evohime-updater, artifact: evohime-transaction.exe, version_file: release-versions/transaction.txt }
