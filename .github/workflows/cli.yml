name: cli module
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ['crates/evohime-cli/**', 'release-versions/cli.txt', '.github/workflows/cli.yml', '.github/workflows/module-native.yml']

concurrency:
  group: evohime-module-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  linux-contract:
    name: cli — Linux contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p evohime-cli
      - run: cargo clippy --locked -p evohime-cli --all-targets -- -D warnings
      - run: cargo build --locked -p evohime-cli
      - name: Verify unsupported production transport fails closed
        shell: bash
        run: |
          set +e
          ./target/debug/eva doctor --json >stdout.log 2>stderr.log
          status=$?
          set -e
          test "$status" -eq 7
          grep -q '^core_unavailable:' stderr.log

  module:
    uses: ./.github/workflows/module-native.yml
    permissions: { contents: write }
    with: { module: cli, package: evohime-cli, artifact: eva.exe, version_file: release-versions/cli.txt }
