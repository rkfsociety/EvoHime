name: cli module
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ['crates/evohime-cli/**', 'release-versions/cli.txt', '.github/workflows/cli.yml', '.github/workflows/module-native.yml']

concurrency:
  group: evohime-module-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module:
    uses: ./.github/workflows/module-native.yml
    permissions: { contents: write }
    with: { module: cli, package: evohime-cli, artifact: eva.exe, version_file: release-versions/cli.txt }
