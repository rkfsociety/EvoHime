name: cli module
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/evohime-cli/**'
      - 'crates/evohime-cli-protocol/**'
      - 'crates/evohime-cli-contract/**'
      - 'crates/desktop-ipc/**'
      - 'crates/evohime-core/**'
      - 'release-versions/cli.txt'
      - '.github/workflows/cli.yml'
      - '.github/workflows/module-native.yml'

concurrency:
  group: evohime-module-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  linux-contract:
    name: cli — Linux contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-linux-${{ runner.arch }}
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p evohime-cli-contract -p evohime-cli-protocol
      - run: cargo clippy --locked -p evohime-cli-contract -p evohime-cli-protocol --all-targets -- -D warnings
      # Core owns the Linux release build and headless runtime check. These
      # CLI-only checks need an executable, but do not need another release
      # build of the shared Core graph.
      - run: cargo build --locked -p evohime-cli
      - name: Verify invalid invocation is bounded
        shell: bash
        run: |
          set +e
          ./target/debug/eva run --unknown >stdout-invalid.log 2>stderr-invalid.log
          status=$?
          set -e
          test "$status" -eq 2
          grep -qx 'unknown command or option' stderr-invalid.log
      - name: Verify oversized stdin is rejected before buffering
        shell: bash
        run: |
          set +e
          head -c 131053 /dev/zero | tr '\0' 'x' | ./target/debug/eva run seed --stdin >stdout-stdin.log 2>stderr-stdin.log
          status=$?
          set -e
          test "$status" -eq 2
          grep -qx 'value is missing or exceeds the CLI bound' stderr-stdin.log
          test ! -s stdout-stdin.log

  module:
    needs: linux-contract
    uses: ./.github/workflows/module-native.yml
    permissions: { contents: write }
    with: { module: cli, package: evohime-cli, artifact: eva.exe, version_file: release-versions/cli.txt }
