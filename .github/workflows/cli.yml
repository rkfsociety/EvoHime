name: cli module
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/evohime-cli/**'
      - 'crates/evohime-cli-protocol/**'
      - 'crates/evohime-cli-contract/**'
      - 'crates/desktop-ipc/**'
      - 'crates/evohime-core/**'
      - 'release-versions/cli.txt'
      - '.github/workflows/cli.yml'
      - '.github/workflows/module-native.yml'

concurrency:
  group: evohime-module-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  linux-contract:
    name: cli — Linux contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p evohime-cli-contract
      - run: cargo test --locked -p evohime-cli-protocol
      - run: cargo test --locked -p evohime-cli
      - run: cargo test --locked -p evohime-desktop-ipc
      - run: cargo clippy --locked -p evohime-cli-contract --all-targets -- -D warnings
      - run: cargo clippy --locked -p evohime-cli-protocol --all-targets -- -D warnings
      - run: cargo clippy --locked -p evohime-cli --all-targets -- -D warnings
      - run: cargo clippy --locked -p evohime-desktop-ipc --all-targets -- -D warnings
      - run: cargo build --locked --release -p evohime-cli -p evohime-core
      - name: Verify Linux Core autostart and private IPC endpoint
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/evohime-runtime"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/evohime-config"
          export EVOHIME_DATA_DIR="$RUNNER_TEMP/evohime-data"
          mkdir -p "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME/evohime"
          chmod 700 "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME/evohime"
          printf '%s\n' 'MODEL_PROVIDER=literouter' 'LITEROUTER_API_KEY=ci-test-key-not-a-secret' > "$XDG_CONFIG_HOME/evohime/provider.env"
          chmod 600 "$XDG_CONFIG_HOME/evohime/provider.env"
          ./target/release/eva doctor --json >doctor.ndjson
          grep -q '"kind":"core.ready"' doctor.ndjson
          test -S "$XDG_RUNTIME_DIR/evohime/core.sock"
          test "$(stat -c '%a' "$XDG_RUNTIME_DIR/evohime")" = 700
          test "$(stat -c '%a' "$XDG_RUNTIME_DIR/evohime/core.sock")" = 600
          test "$(stat -c '%a' "$XDG_RUNTIME_DIR/evohime/session.json")" = 600
      - name: Verify invalid invocation is bounded
        shell: bash
        run: |
          set +e
          ./target/release/eva run --unknown >stdout-invalid.log 2>stderr-invalid.log
          status=$?
          set -e
          test "$status" -eq 2
          grep -qx 'unknown command or option' stderr-invalid.log
      - name: Verify oversized stdin is rejected before buffering
        shell: bash
        run: |
          set +e
          head -c 131053 /dev/zero | tr '\0' 'x' | ./target/release/eva run seed --stdin >stdout-stdin.log 2>stderr-stdin.log
          status=$?
          set -e
          test "$status" -eq 2
          grep -qx 'value is missing or exceeds the CLI bound' stderr-stdin.log
          test ! -s stdout-stdin.log

  module:
    needs: linux-contract
    uses: ./.github/workflows/module-native.yml
    permissions: { contents: write }
    with: { module: cli, package: evohime-cli, artifact: eva.exe, version_file: release-versions/cli.txt }
