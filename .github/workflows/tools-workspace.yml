name: tools-workspace module

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/evohime-tools-workspace/**'
      - 'crates/evohime-service-contract/**'
      - 'release-versions/tools-workspace.txt'
      - '.github/workflows/tools-workspace.yml'
      - '.github/workflows/module-native.yml'

concurrency:
  group: evohime-module-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  module:
    uses: ./.github/workflows/module-native.yml
    permissions: { contents: write }
    with:
      module: tools-workspace
      package: evohime-tools-workspace
      artifact: evohime-tools-workspace.exe
      version_file: release-versions/tools-workspace.txt
