name: tools-exec module

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/evohime-tools-exec/**'
      - 'crates/evohime-service-contract/**'
      - 'release-versions/tools-exec.txt'
      - '.github/workflows/tools-exec.yml'
      - '.github/workflows/module-native.yml'

concurrency:
  group: evohime-module-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  module:
    uses: ./.github/workflows/module-native.yml
    permissions: { contents: write }
    with:
      module: tools-exec
      package: evohime-tools-exec
      artifact: evohime-tools-exec.exe
      version_file: release-versions/tools-exec.txt
