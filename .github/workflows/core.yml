name: EvoHime — core module

on:
  push:
    branches: [main]
    paths:
      - 'crates/evohime-core/**'
      - 'crates/evohime-model-gateway/**'
      - 'crates/evohime-permissions/**'
      - 'crates/tool-runtime/**'
      - 'crates/local-storage/**'
      - 'crates/evohime-local-storage/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'release-versions/core.txt'
      - '.github/workflows/core.yml'
  pull_request:
    paths:
      - 'crates/evohime-core/**'
      - 'crates/evohime-model-gateway/**'
      - 'crates/evohime-permissions/**'
      - 'crates/tool-runtime/**'
      - 'crates/evohime-local-storage/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'release-versions/core.txt'
      - '.github/workflows/core.yml'

permissions:
  contents: read

jobs:
  core:
    name: Core — tests, lint and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Core format
        run: cargo fmt --all -- --check
      - name: Core tests
        run: cargo test --locked -p evohime-core -p evohime-local-storage -p evohime-model-gateway -p evohime-permissions -p evohime-tool-runtime
      - name: Core lint
        run: cargo clippy --locked -p evohime-core --all-targets -- -D warnings
      - name: Core build
        run: cargo build --locked --release -p evohime-core
      - uses: actions/upload-artifact@v7
        with:
          name: evohime-core-module
          path: target/release/evohime-core.exe
          if-no-files-found: error

  publish:
    name: Core — update common Release
    needs: core
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: evohime-core-module
          path: core-output
      - name: Publish Core artifact to common Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view installer 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create installer --title 'EvoHime — общий релиз' --notes 'Модульные артефакты EvoHime.' }
          gh release upload installer (Join-Path $env:GITHUB_WORKSPACE 'core-output\evohime-core.exe') --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось опубликовать Core.' }
