name: core module

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/evohime-core/**'
      - 'crates/evohime-model-gateway/**'
      - 'crates/evohime-permissions/**'
      - 'crates/tool-runtime/**'
      - 'crates/evohime-local-storage/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'release-versions/core.txt'
      - '.github/workflows/core.yml'

concurrency:
  group: evohime-module-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core — tests, lint and build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Core format
        run: cargo fmt --all -- --check
      - name: Core tests
        shell: pwsh
        run: |
          function Invoke-BoundedCargoTest([string]$package) {
            Write-Host "Testing package: $package"
            $process = Start-Process -FilePath 'cargo.exe' -ArgumentList @('test', '--locked', '-p', $package) -NoNewWindow -PassThru
            if (-not $process.WaitForExit(4 * 60 * 1000)) {
              taskkill.exe /PID $process.Id /T /F
              throw "Core tests exceeded the 4-minute limit for $package."
            }
            if ($process.ExitCode -ne 0) { throw "Core tests failed for $package (exit code $($process.ExitCode))." }
          }
          @('evohime-core', 'evohime-local-storage', 'evohime-model-gateway', 'evohime-permissions', 'evohime-tool-runtime') | ForEach-Object { Invoke-BoundedCargoTest $_ }
      - name: Core lint
        run: cargo clippy --locked -p evohime-core --all-targets -- -D warnings
      - name: Core build
        run: cargo build --locked --release -p evohime-core
      - uses: actions/upload-artifact@v7
        with:
          name: evohime-core-module
          path: target/release/evohime-core.exe
          if-no-files-found: error

  publish:
    name: Core — stable module release
    needs: core
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: evohime-core-module
          path: core-output
      - name: Publish Core artifact to module release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'release-versions\core.txt') -Raw).Trim()
          ./scripts/module-release.ps1 -Module core -Version $version -Artifact (Join-Path $env:GITHUB_WORKSPACE 'core-output\evohime-core.exe')
