name: core module

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/evohime-core/**'
      - 'crates/context-budget/**'
      - 'crates/evohime-cli-contract/**'
      - 'crates/model-gateway/**'
      - 'crates/permissions/**'
      - 'crates/tool-runtime/**'
      - 'crates/evohime-local-storage/**'
      - 'crates/evohime-receipts/**'
      - 'crates/desktop-ipc/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'release-versions/core.txt'
      - '.github/workflows/core.yml'

concurrency:
  group: evohime-module-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Cached target directories behave better without incremental fingerprints,
  # and CI never benefits from reusing a partially written incremental cache.
  CARGO_INCREMENTAL: '0'
  # Debug info is irrelevant for test execution but dominates test binary
  # linking time; line tables keep actionable backtraces.
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  linux-cli-runtime:
    name: Core — Linux headless CLI runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-linux-release
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p evohime-desktop-ipc
      - run: cargo build --locked --release -p evohime-core -p evohime-cli
      - name: Verify Linux Core autostart and private IPC endpoint
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/evohime-runtime"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/evohime-config"
          export EVOHIME_DATA_DIR="$RUNNER_TEMP/evohime-data"
          mkdir -p "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME/evohime"
          chmod 700 "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME/evohime"
          printf '%s\n' 'MODEL_PROVIDER=literouter' 'LITEROUTER_API_KEY=ci-test-key-not-a-secret' > "$XDG_CONFIG_HOME/evohime/provider.env"
          chmod 600 "$XDG_CONFIG_HOME/evohime/provider.env"
          ./target/release/eva doctor --json >doctor.ndjson
          grep -q '"kind":"core.ready"' doctor.ndjson
          test -S "$XDG_RUNTIME_DIR/evohime/core.sock"
          test "$(stat -c '%a' "$XDG_RUNTIME_DIR/evohime")" = 700
          test "$(stat -c '%a' "$XDG_RUNTIME_DIR/evohime/core.sock")" = 600
          test "$(stat -c '%a' "$XDG_RUNTIME_DIR/evohime/session.json")" = 600

  core:
    name: Core — tests and lint
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUST_MIN_STACK: 33554432
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-windows-test
          cache-on-failure: true
      - name: Core format
        run: cargo fmt --all -- --check
      - name: Core test build
        run: >-
          cargo test --locked --no-run --lib --bins --tests --examples
          -p evohime-core
          -p evohime-context-budget
          -p evohime-local-storage
          -p evohime-model-gateway
          -p evohime-permissions
          -p evohime-tool-runtime
      - name: Core tests
        # Compilation happens in the previous step, so the step timeout bounds
        # test execution only. Running the same -p set and target selection as
        # the build keeps Cargo's feature unification identical and avoids
        # rebuilding packages. Target selection also skips doc-tests, which the
        # separate rustdoc workflow already runs for the workspace.
        timeout-minutes: 30
        run: >-
          cargo test --locked --lib --bins --tests --no-fail-fast
          -p evohime-core
          -p evohime-context-budget
          -p evohime-local-storage
          -p evohime-model-gateway
          -p evohime-permissions
          -p evohime-tool-runtime
      - name: Core lint
        run: cargo clippy --locked -p evohime-core --all-targets -- -D warnings

  release:
    name: Core — release build
    # The release binary is only consumed by the publish job, so pull requests
    # do not pay for a separate release-profile build of the whole graph.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-windows-release
          cache-on-failure: true
      - name: Core release build
        run: cargo build --locked --release -p evohime-core
      - uses: actions/upload-artifact@v7
        with:
          name: evohime-core-module
          path: target/release/evohime-core.exe
          if-no-files-found: error

  publish:
    name: Core — stable module release
    needs: [core, release, linux-cli-runtime]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: evohime-core-module
          path: core-output
      - name: Publish Core artifact to module release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'release-versions\core.txt') -Raw).Trim()
          ./scripts/module-release.ps1 -Module core -Version $version -Artifact (Join-Path $env:GITHUB_WORKSPACE 'core-output\evohime-core.exe')
