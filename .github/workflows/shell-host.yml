name: shell-host module

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/evohime-electron/src/main/**'
      - 'desktop/evohime-electron/tests/**'
      - 'desktop/evohime-electron/src/preload/**'
      - 'desktop/evohime-electron/electron.vite.config.ts'
      - 'desktop/evohime-electron/electron-builder.yml'
      - 'desktop/evohime-electron/package*.json'
      - 'release-versions/shell-host.txt'
      - '.github/workflows/shell-host.yml'

concurrency:
  group: evohime-module-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Shell host — tests and package
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/evohime-electron
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/postinstall-allowlist.mjs
      - run: npm run check:protocol
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run package:from-build
      - name: Package complete shell host
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'desktop\evohime-electron\release\win-unpacked'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'shell-host.zip'
          if (-not (Test-Path -LiteralPath (Join-Path $source 'EvoHime.exe'))) { throw "Electron executable missing: $source" }
          if (-not (Test-Path -LiteralPath (Join-Path $source 'resources\app.asar'))) { throw "Electron app.asar missing: $source" }
          if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
          Compress-Archive -Path (Join-Path $source '*') -DestinationPath $archive -CompressionLevel Optimal
      - uses: actions/upload-artifact@v7
        with:
          name: module-shell-host
          path: shell-host.zip
          if-no-files-found: error

  publish:
    name: Shell host — release
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: module-shell-host
          path: shell-output
      - name: Publish shell host module release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath 'release-versions/shell-host.txt' -Raw).Trim()
          ./scripts/module-release.ps1 -Module shell-host -Version $version -Artifact (Join-Path $env:GITHUB_WORKSPACE 'shell-output\shell-host.zip')
