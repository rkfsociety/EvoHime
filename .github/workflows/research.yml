name: research module

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/evohime-research/**'
      - 'crates/evohime-service-contract/**'
      - 'release-versions/research.txt'
      - '.github/workflows/research.yml'
      - '.github/workflows/module-native.yml'

concurrency:
  group: evohime-module-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  module:
    uses: ./.github/workflows/module-native.yml
    permissions: { contents: write }
    with:
      module: research
      package: evohime-research
      artifact: evohime-research.exe
      version_file: release-versions/research.txt
