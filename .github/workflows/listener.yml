name: listener-runtime module

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/evohime-listener/**'
      - 'scripts/build-listener-runtime.ps1'
      - 'release-versions/listener-runtime.txt'
      - '.github/workflows/listener.yml'

permissions:
  contents: read

concurrency:
  group: evohime-listener-${{ github.ref }}
  cancel-in-progress: true

jobs:
  listener-runtime:
    name: Listener runtime — build and artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Listener privacy gate
        shell: pwsh
        run: ./scripts/ambient-privacy.tests.ps1
      - name: Build listener runtime
        shell: pwsh
        run: ./scripts/build-listener-runtime.ps1 -Rungs @('tiny')
      - name: Upload listener module artifact
        uses: actions/upload-artifact@v7
        with:
          name: evohime-listener-module
          path: artifacts/listener-runtime
          if-no-files-found: error

  publish:
    name: Listener runtime — stable release
    needs: listener-runtime
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: evohime-listener-module
          path: listener-runtime-output
      - name: Publish listener-runtime assets to module Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'listener-runtime-output'
          if (-not (Test-Path (Join-Path $bundle 'listener-runtime.json'))) { throw 'Listener manifest missing.' }
          $version = (Get-Content -LiteralPath 'release-versions/listener-runtime.txt' -Raw).Trim()
          $notesPath = Join-Path $env:RUNNER_TEMP 'listener-runtime-release-notes.md'
          @(
            "# listener-runtime $version"
            ''
            '## Назначение'
            'Комплект библиотек распознавания речи и моделей для модуля listener-runtime.'
            ''
            '## Что изменилось'
            "Опубликована версия `$version` после успешной privacy-проверки и сборки рантайма."
            'Обновляется только listener-runtime; остальные модульные релизы не изменяются.'
            ''
            '## Состав поставки'
            'Манифест содержит версии, размеры и SHA-256 всех DLL и моделей.'
            'Файлы публикуются только после успешного завершения тестов и сборки.'
          ) | Set-Content -LiteralPath $notesPath -Encoding utf8NoBOM
          $releaseTag = "module-listener-runtime-v$version"
          gh release view $releaseTag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $releaseTag --title "listener-runtime $version" --notes-file $notesPath
          } else {
            gh release edit $releaseTag --title "listener-runtime $version" --notes-file $notesPath
          }
          Get-ChildItem -LiteralPath $bundle -File | ForEach-Object {
            gh release upload $releaseTag $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "Не удалось опубликовать $($_.Name)." }
          }
          $releaseRows = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | [.tag_name, (.id|tostring)] | @tsv')
          foreach ($row in $releaseRows) {
            $parts = $row -split "`t", 2
            $oldTag = $parts[0]
            $oldId = $parts[1]
            if (($oldTag -notlike 'module-listener-runtime-v*' -and $oldTag -ne 'module-listener-runtime') -or $oldTag -eq $releaseTag) { continue }
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$oldId"
            if ($LASTEXITCODE -ne 0) { throw "Не удалось удалить старый релиз $oldTag." }
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$oldTag" 2>$null
          }
