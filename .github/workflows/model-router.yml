name: model-router module

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/evohime-model-router/**'
      - 'crates/evohime-service-contract/**'
      - 'release-versions/model-router.txt'
      - '.github/workflows/model-router.yml'
      - '.github/workflows/module-native.yml'

concurrency:
  group: evohime-module-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  module:
    uses: ./.github/workflows/module-native.yml
    permissions: { contents: write }
    with:
      module: model-router
      package: evohime-model-router
      artifact: evohime-model-router.exe
      version_file: release-versions/model-router.txt
