name: module router

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      modules:
        description: 'Модули для ручного запуска через запятую; пусто — только версии выше опубликованных'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: module-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Определить изменённые модули
    runs-on: windows-latest
    outputs:
      shell-host: ${{ steps.select.outputs.shell-host }}
      ui-bundle: ${{ steps.select.outputs.ui-bundle }}
      core: ${{ steps.select.outputs.core }}
      supervisor: ${{ steps.select.outputs.supervisor }}
      cli: ${{ steps.select.outputs.cli }}
      analysis-worker: ${{ steps.select.outputs.analysis-worker }}
      listener: ${{ steps.select.outputs.listener }}
      listener-runtime: ${{ steps.select.outputs.listener-runtime }}
      transaction: ${{ steps.select.outputs.transaction }}
      verifier: ${{ steps.select.outputs.verifier }}
      updater: ${{ steps.select.outputs.updater }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: select
        name: Сопоставить версии модулей с последними релизами
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MANUAL_MODULES: ${{ inputs.modules }}
        run: |
          $modules = @('shell-host', 'ui-bundle', 'core', 'supervisor', 'cli', 'analysis-worker', 'listener', 'listener-runtime', 'transaction', 'verifier', 'updater')
          $manual = @($env:MANUAL_MODULES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $manualSet = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($module in $manual) {
            if ($module -notin $modules) { throw "Неизвестный модуль для ручного запуска: $module" }
            [void]$manualSet.Add($module)
          }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $releases = @(Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:REPOSITORY/releases?per_page=100")
          function Parse-Version([string]$value) {
            if ($value -notmatch '^\d+\.\d+\.\d+$') { return $null }
            return [Version]::Parse($value)
          }
          function Latest-Version([string]$module) {
            $prefix = "module-$module-v"
            $versions = foreach ($release in $releases) {
              if ($release.tag_name -is [string] -and $release.tag_name.StartsWith($prefix)) {
                $candidate = Parse-Version $release.tag_name.Substring($prefix.Length)
                if ($null -ne $candidate) { $candidate }
              }
            }
            return @($versions | Sort-Object -Descending | Select-Object -First 1)
          }
          foreach ($module in $modules) {
            $versionPath = Join-Path $env:GITHUB_WORKSPACE "release-versions/$module.txt"
            if (-not (Test-Path -LiteralPath $versionPath -PathType Leaf)) { throw "Не найден файл версии: $versionPath" }
            $currentText = (Get-Content -LiteralPath $versionPath -Raw).Trim()
            $current = Parse-Version $currentText
            if ($null -eq $current) { throw "Некорректная версия $module`: $currentText" }
            $latest = Latest-Version $module
            $selected = $manualSet.Contains($module) -or ($manual.Count -eq 0 -and ($latest.Count -eq 0 -or $current -gt $latest[0]))
            $value = $selected.ToString().ToLowerInvariant()
            "$module=$value" >> $env:GITHUB_OUTPUT
            if ($selected) {
              $latestText = if ($latest.Count) { $latest[0].ToString() } else { 'нет релиза' }
              Write-Host "$module`: $currentText -> $latestText, workflow будет запущен"
            } else {
              Write-Host "$module`: $currentText уже опубликован, workflow пропускается"
            }
          }

  dispatch:
    name: Запустить отдельные workflow модулей
    needs: changes
    runs-on: windows-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch selected module workflows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          $selected = @{
            'shell-host' = '${{ needs.changes.outputs.shell-host }}'
            'ui-bundle' = '${{ needs.changes.outputs.ui-bundle }}'
            'core' = '${{ needs.changes.outputs.core }}'
            'supervisor' = '${{ needs.changes.outputs.supervisor }}'
            'cli' = '${{ needs.changes.outputs.cli }}'
            'analysis-worker' = '${{ needs.changes.outputs.analysis-worker }}'
            'listener' = '${{ needs.changes.outputs.listener }}'
            'listener-runtime' = '${{ needs.changes.outputs.listener-runtime }}'
            'transaction' = '${{ needs.changes.outputs.transaction }}'
            'verifier' = '${{ needs.changes.outputs.verifier }}'
            'updater' = '${{ needs.changes.outputs.updater }}'
          }
          $workflowFiles = @{
            'shell-host' = 'shell-host.yml'; 'ui-bundle' = 'ui-bundle.yml'; 'core' = 'core.yml'; 'supervisor' = 'supervisor.yml'; 'cli' = 'cli.yml'; 'analysis-worker' = 'analysis-worker.yml'; 'listener' = 'listener-module.yml'; 'listener-runtime' = 'listener.yml'; 'transaction' = 'transaction.yml'; 'verifier' = 'verifier.yml'; 'updater' = 'update-agent.yml'
          }
          foreach ($module in $selected.Keys) {
            if ($selected[$module] -ne 'true') { continue }
            gh workflow run $workflowFiles[$module] --repo $env:REPOSITORY --ref $env:REF
            if ($LASTEXITCODE -ne 0) { throw "Не удалось запустить workflow модуля $module." }
            Write-Host "Запущен отдельный workflow: $module"
          }
