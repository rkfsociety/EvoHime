name: module router

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: 'Базовый commit для ручной проверки'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: module-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Определить изменённые модули
    runs-on: windows-latest
    outputs:
      shell-host: ${{ steps.select.outputs.shell-host }}
      ui-bundle: ${{ steps.select.outputs.ui-bundle }}
      core: ${{ steps.select.outputs.core }}
      supervisor: ${{ steps.select.outputs.supervisor }}
      cli: ${{ steps.select.outputs.cli }}
      analysis-worker: ${{ steps.select.outputs.analysis-worker }}
      listener: ${{ steps.select.outputs.listener }}
      listener-runtime: ${{ steps.select.outputs.listener-runtime }}
      transaction: ${{ steps.select.outputs.transaction }}
      verifier: ${{ steps.select.outputs.verifier }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: select
        name: Вычислить граф изменений и зависимостей
        shell: pwsh
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MANUAL_BASE: ${{ inputs.base }}
        run: |
          $base = if ($env:MANUAL_BASE) { $env:MANUAL_BASE } elseif ($env:BEFORE -and $env:BEFORE -ne ('0' * 40)) { $env:BEFORE } else { (git rev-list --max-parents=0 HEAD) }
          $paths = @(git diff --name-only $base $env:AFTER)
          function Has-Path([scriptblock]$predicate) { @($paths | Where-Object $predicate).Count -gt 0 }
          $workflowChanged = Has-Path { $_ -like '.github/workflows/*' }
          $all = ($paths -contains 'Cargo.toml' -or $paths -contains 'Cargo.lock' -or $workflowChanged)
          $rustShared = $all -or (Has-Path { $_ -like 'crates/evohime-model-gateway/*' -or $_ -like 'crates/evohime-permissions/*' -or $_ -like 'crates/tool-runtime/*' -or $_ -like 'crates/evohime-local-storage/*' -or $_ -like 'crates/local-storage/*' })
          $electronShared = $all -or (Has-Path { $_ -like 'desktop/evohime-electron/src/shared/*' -or $_ -like 'desktop/evohime-electron/package*.json' })
          $core = $all -or $rustShared -or (Has-Path { $_ -like 'crates/evohime-core/*' -or $_ -eq 'release-versions/core.txt' })
          $supervisor = $all -or $rustShared -or (Has-Path { $_ -like 'crates/evohime-supervisor/*' -or $_ -like 'crates/evohime-process/*' -or $_ -eq 'release-versions/supervisor.txt' })
          $cli = $all -or $core -or (Has-Path { $_ -like 'crates/evohime-cli/*' -or $_ -eq 'release-versions/cli.txt' })
          $analysis = $all -or $core -or $supervisor -or (Has-Path { $_ -eq 'release-versions/analysis-worker.txt' })
          $transaction = $all -or $rustShared -or (Has-Path { $_ -like 'crates/evohime-updater/*' -or $_ -eq 'release-versions/transaction.txt' })
          $verifier = $all -or $rustShared -or (Has-Path { $_ -like 'crates/evohime-receipts/*' -or $_ -eq 'release-versions/verifier.txt' })
          $listener = $all -or $core -or (Has-Path { $_ -like 'crates/evohime-listener/*' -or $_ -like 'crates/evohime-listener-*/*' -or $_ -eq 'release-versions/listener.txt' })
          $runtime = $all -or $listener -or (Has-Path { $_ -eq 'release-versions/listener-runtime.txt' -or $_ -eq 'scripts/build-listener-runtime.ps1' })
          $ui = $all -or $electronShared -or (Has-Path { $_ -like 'desktop/evohime-electron/src/renderer/*' -or $_ -like 'desktop/evohime-electron/vite.config.*' -or $_ -eq 'release-versions/ui-bundle.txt' })
          $shell = $all -or $electronShared -or $core -or $supervisor -or $transaction -or $verifier -or (Has-Path { $_ -like 'desktop/evohime-electron/src/main/*' -or $_ -like 'desktop/evohime-electron/src/preload/*' -or $_ -eq 'release-versions/shell-host.txt' })
          foreach ($item in @{'shell-host'=$shell;'ui-bundle'=$ui;'core'=$core;'supervisor'=$supervisor;'cli'=$cli;'analysis-worker'=$analysis;'listener'=$listener;'listener-runtime'=$runtime;'transaction'=$transaction;'verifier'=$verifier}.GetEnumerator()) {
            $value = ([bool]$item.Value).ToString().ToLower()
            "$($item.Key)=$value" >> $env:GITHUB_OUTPUT
          }

  shell-host:
    needs: changes
    if: needs.changes.outputs.shell-host == 'true'
    uses: ./.github/workflows/shell-host.yml
    permissions: { contents: write }
    secrets: inherit
  ui-bundle:
    needs: changes
    if: needs.changes.outputs.ui-bundle == 'true'
    uses: ./.github/workflows/ui-bundle.yml
    permissions: { contents: write }
    secrets: inherit
  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/core.yml
    permissions: { contents: write }
    secrets: inherit
  supervisor:
    needs: changes
    if: needs.changes.outputs.supervisor == 'true'
    uses: ./.github/workflows/supervisor.yml
    permissions: { contents: write }
    secrets: inherit
  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    uses: ./.github/workflows/cli.yml
    permissions: { contents: write }
    secrets: inherit
  analysis-worker:
    needs: changes
    if: needs.changes.outputs.analysis-worker == 'true'
    uses: ./.github/workflows/analysis-worker.yml
    permissions: { contents: write }
    secrets: inherit
  listener:
    needs: changes
    if: needs.changes.outputs.listener == 'true'
    uses: ./.github/workflows/listener-module.yml
    permissions: { contents: write }
    secrets: inherit
  listener-runtime:
    needs: changes
    if: needs.changes.outputs.listener-runtime == 'true'
    uses: ./.github/workflows/listener.yml
    permissions: { contents: write }
    secrets: inherit
  transaction:
    needs: changes
    if: needs.changes.outputs.transaction == 'true'
    uses: ./.github/workflows/transaction.yml
    permissions: { contents: write }
    secrets: inherit
  verifier:
    needs: changes
    if: needs.changes.outputs.verifier == 'true'
    uses: ./.github/workflows/verifier.yml
    permissions: { contents: write }
    secrets: inherit
