name: module router

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: 'Базовый commit для ручной проверки'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: module-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Определить изменённые модули
    runs-on: windows-latest
    outputs:
      shell-host: ${{ steps.select.outputs.shell-host }}
      ui-bundle: ${{ steps.select.outputs.ui-bundle }}
      core: ${{ steps.select.outputs.core }}
      supervisor: ${{ steps.select.outputs.supervisor }}
      cli: ${{ steps.select.outputs.cli }}
      analysis-worker: ${{ steps.select.outputs.analysis-worker }}
      listener: ${{ steps.select.outputs.listener }}
      listener-runtime: ${{ steps.select.outputs.listener-runtime }}
      transaction: ${{ steps.select.outputs.transaction }}
      verifier: ${{ steps.select.outputs.verifier }}
      updater: ${{ steps.select.outputs.updater }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: select
        name: Вычислить граф изменений и зависимостей
        shell: pwsh
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MANUAL_BASE: ${{ inputs.base }}
        run: |
          $base = if ($env:MANUAL_BASE) { $env:MANUAL_BASE } elseif ($env:BEFORE -and $env:BEFORE -ne ('0' * 40)) { $env:BEFORE } else { (git rev-list --max-parents=0 HEAD) }
          $paths = @(git diff --name-only $base $env:AFTER)
          function Has-Path([scriptblock]$predicate) { @($paths | Where-Object $predicate).Count -gt 0 }
          $workflowShared = Has-Path { $_ -eq '.github/workflows/module-native.yml' -or $_ -eq 'scripts/module-release.ps1' }
          $all = ($paths -contains 'Cargo.toml' -or $paths -contains 'Cargo.lock' -or $workflowShared)
          $rustShared = $all -or (Has-Path { $_ -like 'crates/evohime-model-gateway/*' -or $_ -like 'crates/evohime-permissions/*' -or $_ -like 'crates/tool-runtime/*' -or $_ -like 'crates/evohime-local-storage/*' -or $_ -like 'crates/local-storage/*' })
          $electronShared = $all -or (Has-Path { $_ -like 'desktop/evohime-electron/src/shared/*' -or $_ -like 'desktop/evohime-electron/package*.json' })
          $core = $all -or $rustShared -or (Has-Path { $_ -like 'crates/evohime-core/*' -or $_ -eq 'release-versions/core.txt' -or $_ -eq '.github/workflows/core.yml' })
          $supervisor = $all -or $rustShared -or (Has-Path { $_ -like 'crates/evohime-supervisor/*' -or $_ -like 'crates/evohime-process/*' -or $_ -eq 'release-versions/supervisor.txt' -or $_ -eq '.github/workflows/supervisor.yml' })
          $cli = $all -or $core -or (Has-Path { $_ -like 'crates/evohime-cli/*' -or $_ -eq 'release-versions/cli.txt' -or $_ -eq '.github/workflows/cli.yml' })
          $analysis = $all -or $core -or $supervisor -or (Has-Path { $_ -eq 'release-versions/analysis-worker.txt' -or $_ -eq '.github/workflows/analysis-worker.yml' })
          $transaction = $all -or $rustShared -or (Has-Path { $_ -like 'crates/evohime-updater/*' -or $_ -eq 'release-versions/transaction.txt' -or $_ -eq '.github/workflows/transaction.yml' })
          $verifier = $all -or $rustShared -or (Has-Path { $_ -like 'crates/evohime-receipts/*' -or $_ -eq 'release-versions/verifier.txt' -or $_ -eq '.github/workflows/verifier.yml' })
          $updater = $all -or (Has-Path { $_ -like 'crates/evohime-update-agent/*' -or $_ -eq 'release-versions/updater.txt' -or $_ -eq '.github/workflows/update-agent.yml' })
          $listener = $all -or $core -or (Has-Path { $_ -like 'crates/evohime-listener/*' -or $_ -like 'crates/evohime-listener-*/*' -or $_ -eq 'release-versions/listener.txt' -or $_ -eq '.github/workflows/listener-module.yml' })
          $runtime = $all -or $listener -or (Has-Path { $_ -eq 'release-versions/listener-runtime.txt' -or $_ -eq 'scripts/build-listener-runtime.ps1' -or $_ -eq '.github/workflows/listener.yml' })
          $ui = $all -or $electronShared -or (Has-Path { $_ -like 'desktop/evohime-electron/src/renderer/*' -or $_ -like 'desktop/evohime-electron/vite.config.*' -or $_ -eq 'release-versions/ui-bundle.txt' -or $_ -eq '.github/workflows/ui-bundle.yml' })
          $shell = $all -or $electronShared -or $core -or $supervisor -or $transaction -or $verifier -or (Has-Path { $_ -like 'desktop/evohime-electron/src/main/*' -or $_ -like 'desktop/evohime-electron/src/preload/*' -or $_ -eq 'release-versions/shell-host.txt' -or $_ -eq '.github/workflows/shell-host.yml' })
          foreach ($item in @{'shell-host'=$shell;'ui-bundle'=$ui;'core'=$core;'supervisor'=$supervisor;'cli'=$cli;'analysis-worker'=$analysis;'listener'=$listener;'listener-runtime'=$runtime;'transaction'=$transaction;'verifier'=$verifier;'updater'=$updater}.GetEnumerator()) {
            $value = ([bool]$item.Value).ToString().ToLower()
            "$($item.Key)=$value" >> $env:GITHUB_OUTPUT
          }

  dispatch:
    name: Запустить отдельные workflow модулей
    needs: changes
    runs-on: windows-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch selected module workflows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          $selected = @{
            'shell-host' = '${{ needs.changes.outputs.shell-host }}'
            'ui-bundle' = '${{ needs.changes.outputs.ui-bundle }}'
            'core' = '${{ needs.changes.outputs.core }}'
            'supervisor' = '${{ needs.changes.outputs.supervisor }}'
            'cli' = '${{ needs.changes.outputs.cli }}'
            'analysis-worker' = '${{ needs.changes.outputs.analysis-worker }}'
            'listener' = '${{ needs.changes.outputs.listener }}'
            'listener-runtime' = '${{ needs.changes.outputs.listener-runtime }}'
            'transaction' = '${{ needs.changes.outputs.transaction }}'
            'verifier' = '${{ needs.changes.outputs.verifier }}'
            'updater' = '${{ needs.changes.outputs.updater }}'
          }
          $workflowFiles = @{
            'shell-host' = 'shell-host.yml'; 'ui-bundle' = 'ui-bundle.yml'; 'core' = 'core.yml'; 'supervisor' = 'supervisor.yml'; 'cli' = 'cli.yml'; 'analysis-worker' = 'analysis-worker.yml'; 'listener' = 'listener-module.yml'; 'listener-runtime' = 'listener.yml'; 'transaction' = 'transaction.yml'; 'verifier' = 'verifier.yml'; 'updater' = 'update-agent.yml'
          }
          foreach ($module in $selected.Keys) {
            if ($selected[$module] -ne 'true') { continue }
            gh workflow run $workflowFiles[$module] --repo $env:REPOSITORY --ref $env:REF
            if ($LASTEXITCODE -ne 0) { throw "Не удалось запустить workflow модуля $module." }
            Write-Host "Запущен отдельный workflow: $module"
          }
