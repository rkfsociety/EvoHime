name: compatible release manifest

on:
  workflow_run:
    workflows:
      - shell-host module
      - ui-bundle module
      - core module
      - supervisor module
      - cli module
      - analysis-worker module
      - listener module
      - listener-runtime module
      - transaction module
      - verifier module
      - updater module
      - hive module
      - core-assets module
      - evals module
      - media-voice module
      - research module
      - remote-a2a module
      - ambient module
      - computer-use module
      - workflow-engine module
      - rag-memory module
      - tools-workspace module
      - tools-exec module
      - model-adapters module
    types: [completed]
  workflow_dispatch:

concurrency:
  group: evohime-compatible-manifest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish compatible set manifest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate compatible manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-compatible-manifest.ps1 -GenerateOnly
      - name: Validate manifest integrity
        shell: pwsh
        run: ./scripts/validate-manifest-integrity.ps1 -ManifestPath "$env:RUNNER_TEMP/evohime.compatible.json"
      - name: Validate manifest bootstrap compatibility
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/validate-manifest-bootstrap.ps1 -ManifestPath "$env:RUNNER_TEMP/evohime.compatible.json"
      - name: Publish fixed compatible manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-compatible-manifest.ps1 -PublishOnly
