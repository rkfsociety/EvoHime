name: model-adapters module

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/evohime-model-adapters/**'
      - 'crates/evohime-service-contract/**'
      - 'release-versions/model-adapters.txt'
      - '.github/workflows/model-adapters.yml'
      - '.github/workflows/module-native.yml'

concurrency:
  group: evohime-module-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  module:
    uses: ./.github/workflows/module-native.yml
    permissions: { contents: write }
    with:
      module: model-adapters
      package: evohime-model-adapters
      artifact: evohime-model-adapters.exe
      version_file: release-versions/model-adapters.txt
