name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      keep_count:
        description: 'Сколько последних стабильных релизов оставить (по умолчанию только текущий)'
        required: false
        default: '1'
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Test native Rust foundation
        run: cargo test --locked -p evohime-permissions -p evohime-tool-runtime -p evohime-model-gateway -p evohime-core -p evohime-local-storage -p evohime-desktop-ipc -p evohime-updater
      - name: Check supervisor
        run: cargo check --locked -p evohime-supervisor -p evohime-updater

  electron-shell:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/evohime-electron
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install shell dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run allow-listed dependency installers
        run: node scripts/postinstall-allowlist.mjs
      - name: Verify generated IPC bindings match the canonical proto
        run: npm run check:protocol
      - name: Typecheck main, preload and renderer
        run: npm run typecheck
      - name: Build Core for the real-Core IPC E2E tests
        working-directory: .
        run: cargo build --locked -p evohime-core
      - name: Test shell adapter, security policy and real-Core IPC
        run: npm test
      - name: Build shell bundles
        run: npm run build
      - name: Static security checks over the production bundles
        run: npm run check:bundle
      - name: Build unpacked package smoke
        run: npm run package

  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Test package manifest and idempotent staging
        shell: pwsh
        run: ./scripts/native-package.tests.ps1
      - name: Test release version, workflow and retention contracts
        shell: pwsh
        run: |
          ./scripts/version.tests.ps1
          ./scripts/native-workflow.tests.ps1
          ./scripts/github-retention.tests.ps1
      - name: Restore WinUI shell
        shell: pwsh
        run: dotnet restore desktop/EvoHime.Tests/EvoHime.Tests.csproj --nologo
      - name: Build WinUI shell
        shell: pwsh
        run: dotnet build desktop/EvoHime.Tests/EvoHime.Tests.csproj -p:Platform=x64 --nologo --no-restore
      - name: Restore IPC tests
        shell: pwsh
        run: dotnet restore desktop/EvoHime.IpcTests/EvoHime.IpcTests.csproj --nologo
      - name: Build IPC tests
        shell: pwsh
        run: dotnet build desktop/EvoHime.IpcTests/EvoHime.IpcTests.csproj --nologo --no-restore
      - name: Test WinUI shell with hang diagnostics
        timeout-minutes: 10
        shell: pwsh
        run: >-
          dotnet test desktop/EvoHime.IpcTests/EvoHime.IpcTests.csproj
          --nologo --no-build --no-restore
          --results-directory "$env:GITHUB_WORKSPACE\TestResults"
          --logger "console;verbosity=detailed"
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini
      - name: Upload WinUI hang diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: winui-test-diagnostics
          path: TestResults
          if-no-files-found: ignore

  prepare-release:
    needs: [rust-native, windows-check]
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Determine release from project version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content 'desktop/EvoHime.Desktop/EvoHime.Desktop.csproj'
          $version = [string]($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version in EvoHime.Desktop.csproj: $version"
          }

          $latestTag = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>$null
          if ($LASTEXITCODE -ne 0) {
            $latestTag = ''
          }
          $latestVersion = $latestTag.TrimStart('v')
          $shouldRelease = [string]::IsNullOrWhiteSpace($latestVersion) -or
            ([version]::Parse($version) -gt [version]::Parse($latestVersion))
          $tag = "v$version"

          "should_release=$($shouldRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Project version: $version; latest release: $latestTag; release required: $shouldRelease"

  build-native:
    needs: [rust-native, windows-check, prepare-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Build native package after CI checks
        shell: pwsh
        run: |
          ./scripts/build-windows-native.ps1 -OutputPath "$env:GITHUB_WORKSPACE\native-package" -Version $env:RELEASE_VERSION
      - name: Run Electron package startup smoke
        shell: pwsh
        run: ./scripts/electron-acceptance.tests.ps1 -PackagePath "$env:GITHUB_WORKSPACE\native-package"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build single Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC not found: $iscc" }
          & $iscc "/O$env:GITHUB_WORKSPACE\installer-output" "/DAppVersion=$env:RELEASE_VERSION" "/DSourceDir=$env:GITHUB_WORKSPACE\native-package" installer/EvoHime.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and upgrade smoke
        shell: pwsh
        run: |
          $installPath = Join-Path $env:RUNNER_TEMP 'EvoHime-install-smoke'
          $setup = Join-Path $env:GITHUB_WORKSPACE 'installer-output\EvoHime-Setup.exe'
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$installPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($component in @('EvoHime.exe', 'resources\app.asar', 'resources\evohime-agent.ico', 'evohime-core.exe', 'evohime-supervisor.exe', 'evohime-transaction.exe', 'evohime.manifest.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $installPath $component))) { throw "Installed component missing: $component" }
          }
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$installPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $installPath 'EvoHime.exe'))) { throw 'Upgrade removed the client executable.' }
      - name: Rollback smoke after failed installer start
        shell: pwsh
        run: |
          $rollbackPath = Join-Path $env:RUNNER_TEMP 'EvoHime-rollback-smoke'
          $statePath = Join-Path $rollbackPath 'state'
          New-Item -ItemType Directory -Force -Path $rollbackPath | Out-Null
          foreach ($component in @('EvoHime.exe', 'evohime-core.exe', 'evohime-supervisor.exe', 'evohime.manifest.json')) {
            Set-Content -LiteralPath (Join-Path $rollbackPath $component) -Value "before:$component"
          }
          $before = (Get-FileHash (Join-Path $rollbackPath 'EvoHime.exe')).Hash
          $updater = Join-Path $env:GITHUB_WORKSPACE 'native-package\evohime-transaction.exe'
          $failedInstaller = Join-Path $rollbackPath 'missing-installer.exe'
          $process = Start-Process -FilePath $updater -ArgumentList @(
            '--worker',
            '--installer', $failedInstaller,
            '--install-dir', $rollbackPath,
            '--state-dir', $statePath
          ) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -eq 0) { throw 'Failed installer must return a non-zero exit code.' }
          $after = (Get-FileHash (Join-Path $rollbackPath 'EvoHime.exe')).Hash
          if ($before -ne $after) { throw 'Rollback did not restore the previous client.' }
          if (Test-Path -LiteralPath (Join-Path $statePath 'transaction.json')) { throw 'Rollback left a transaction journal.' }
      - name: Upload single installer
        uses: actions/upload-artifact@v7
        with:
          name: evohime-windows-installer
          path: installer-output\EvoHime-Setup.exe
          if-no-files-found: error
      - name: Publish GitHub Release for version tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:RELEASE_TAG" "installer-output\EvoHime-Setup.exe" --generate-notes --title "EvoHime $env:RELEASE_TAG"
      - name: Remove old releases after publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/cleanup-github-releases.ps1 -KeepCount 1

  cleanup-releases:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      KEEP_COUNT: ${{ inputs.keep_count || '1' }}
    steps:
      - uses: actions/checkout@v7
      - name: Remove old releases and version tags
        shell: pwsh
        run: ./scripts/cleanup-github-releases.ps1 -KeepCount ([int]$env:KEEP_COUNT)
