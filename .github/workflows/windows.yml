name: Ручной выпуск EvoHime

# Полный release-контур: тесты, package, installer, upgrade/rollback smoke и
# публикация. Он запускается только вручную через Run workflow и обновляет
# постоянный release лишь после всех acceptance-проверок.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Что именно затронул коммит.
  #
  # Отбор делается здесь, а не через paths-ignore: клиент обновляется только на
  # коммит с зелёными проверками, а у коммита без единого прогона проверок нет
  # вообще — он навсегда остался бы «непроверенным». Пропущенный job, в отличие
  # от отсутствующего прогона, числится пройденным, поэтому workflow стартует
  # всегда, а тяжёлые job включаются по затронутым путям.
  changes:
    name: Изменения
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      electron: ${{ steps.filter.outputs.electron }}
      native: ${{ steps.filter.outputs.native }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Определение затронутых областей
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          # Ручной выпуск всегда проверяет весь продукт.
          files='ALL'
          echo "changed files:"; echo "$files"

          matches() {
            if [ "$files" = 'ALL' ]; then
              return 0
            fi
            echo "$files" | grep -Eq "$1"
          }

          rust=false
          electron=false
          tooling=false
          if matches '^(crates/|Cargo\.(toml|lock)$)'; then rust=true; fi
          if matches '^(desktop/evohime-electron/|crates/desktop-ipc/proto/)'; then electron=true; fi
          if matches '^(scripts/|installer/|\.github/workflows/)'; then tooling=true; fi

          native=false
          if [ "$rust" = true ] || [ "$electron" = true ] || [ "$tooling" = true ]; then native=true; fi
          docs=false
          if matches '^(docs/|README\.md$|AGENTS\.md$|SECURITY\.md$|\.codex/|installer/.*\.(md|txt)$|crates/.*/README\.md$|tests/.*/README\.md$)'; then docs=true; fi

          {
            echo "rust=$rust"
            echo "electron=$electron"
            echo "native=$native"
            echo "docs=$docs"
          } >> "$GITHUB_OUTPUT"

  documentation:
    name: Документация
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Проверка ссылок и устаревших ссылок в документации
        shell: pwsh
        run: ./scripts/documentation.tests.ps1

  # Условие — `native`, а не `rust`: этот job исполняет гейты из scripts/, поэтому
  # правка самого гейта обязана его запускать. Иначе коммит, меняющий только
  # scripts/, доходил до сборки установщика, ни разу не прогнав эти гейты.
  rust-fast:
    name: Rust — быстрые проверки
    needs: changes
    if: >-
      always()
      && needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Runtime Stall Guard — static report
        shell: pwsh
        run: ./scripts/runtime-stall-guard.tests.ps1
      - name: Проверка форматирования Rust
        run: cargo fmt --all -- --check
      - name: Проверка lint всего Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  rust-heavy:
    name: Rust — тесты и security-гейты
    needs: [changes, documentation, rust-fast]
    if: >-
      always()
      && needs.changes.outputs.native == 'true'
      && needs.rust-fast.result == 'success'
      && (needs.documentation.result == 'success' || needs.documentation.result == 'skipped')
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Тесты основной Rust-инфраструктуры
        run: cargo test --locked -p evohime-permissions -p evohime-tool-runtime -p evohime-model-gateway -p evohime-core -p evohime-local-storage -p evohime-desktop-ipc -p evohime-updater -p evohime-receipts -p evohime-listener-contract -p evohime-listener-audio -p evohime-listener-ipc -p evohime-listener
      - name: Privacy gate фонового аудио
        shell: pwsh
        run: ./scripts/ambient-privacy.tests.ps1
      - name: Контракт жизненного цикла ключей receipt
        shell: pwsh
        run: ./scripts/receipt-key-lifecycle.tests.ps1
      - name: Проверка supervisor
        run: cargo check --locked -p evohime-supervisor -p evohime-updater
      - name: Детерминированная оценка и безопасность fixtures
        shell: pwsh
        run: ./scripts/eval-gate.tests.ps1
      - name: Обязательная независимая security-оценка
        shell: pwsh
        run: ./scripts/security-eval-gate.tests.ps1
      - name: Граница runtime автоматизации
        shell: pwsh
        run: ./scripts/automation-release-gate.tests.ps1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Установка Electron-зависимостей для license metadata
        working-directory: desktop/evohime-electron
        run: npm ci --ignore-scripts
      - name: Release evidence и rollback gate
        shell: pwsh
        run: ./scripts/release-evidence.tests.ps1
      - name: Загрузка обезличенного evaluation-артефакта
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-evaluation
          path: artifacts/eval-gate/summary.jsonl
          if-no-files-found: ignore

  # Быстрый Electron-гейт запускается одновременно с rust-fast.
  electron-fast:
    name: Electron — protocol и typecheck
    needs: changes
    if: >-
      always()
      && needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/evohime-electron
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Установка Electron-зависимостей без lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Разрешённые установщики зависимостей
        run: node scripts/postinstall-allowlist.mjs
      - name: Проверка generated IPC bindings против canonical proto
        run: npm run check:protocol
      - name: Typecheck main, preload и renderer
        run: npm run typecheck
  electron-heavy:
    name: Electron — E2E и пакет
    needs: [changes, documentation, rust-heavy, electron-fast]
    if: >-
      always()
      && needs.changes.outputs.native == 'true'
      && needs.rust-heavy.result == 'success'
      && needs.electron-fast.result == 'success'
      && (needs.documentation.result == 'success' || needs.documentation.result == 'skipped')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/evohime-electron
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Установка Electron-зависимостей без lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Разрешённые установщики зависимостей
        run: node scripts/postinstall-allowlist.mjs
      - name: Сборка Core для real-Core IPC E2E
        working-directory: .
        run: cargo build --locked --release -p evohime-core
      - name: Electron — адаптер, политика безопасности и IPC E2E
        run: npm test
      - name: Сборка Electron shell bundles
        run: npm run build
      - name: Проверка безопасности production bundle
        run: npm run check:bundle
      - name: Сборка распакованного Electron package
        run: npm run package

  build-native:
    name: Сборка — native package и smoke
    # electron-heavy тоже в needs: установщик упаковывает собранную им оболочку,
    # поэтому его падение обязано останавливать публикацию.
    needs: [changes, documentation, rust-heavy, electron-heavy]
    # Пропущенная зависимость не должна пропускать этот job, а упавшая — должна
    # его остановить: needs.* даёт skipped, поэтому условие пишется явно.
    if: >-
      !cancelled()
      && !contains(needs.*.result, 'failure')
      && needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Сборка native package после CI-проверок
        shell: pwsh
        run: |
          ./scripts/build-windows-native.ps1 -OutputPath "$env:GITHUB_WORKSPACE\native-package" -Commit $env:GITHUB_SHA -Branch 'main'
      - name: Smoke запуска Electron package
        shell: pwsh
        run: ./scripts/electron-acceptance.tests.ps1 -PackagePath "$env:GITHUB_WORKSPACE\native-package"
      - name: Smoke отказоустойчивости Electron Core и supervisor
        shell: pwsh
        run: ./scripts/electron-fault.tests.ps1 -PackagePath "$env:GITHUB_WORKSPACE\native-package"
      - name: Acceptance matrix Electron package
        shell: pwsh
        run: ./scripts/electron-matrix.tests.ps1 -PackagePath "$env:GITHUB_WORKSPACE\native-package"
      - name: Установка Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Сборка единственного Windows-установщика
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC not found: $iscc" }
          & $iscc "/O$env:GITHUB_WORKSPACE\installer-output" "/DSourceDir=$env:GITHUB_WORKSPACE\native-package" installer/EvoHime.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke установки и обновления
        shell: pwsh
        run: |
          $installPath = Join-Path $env:RUNNER_TEMP 'EvoHime-install-smoke'
          $setup = Join-Path $env:GITHUB_WORKSPACE 'installer-output\EvoHime-Setup.exe'
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$installPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($component in @('EvoHime.exe', 'resources\app.asar', 'resources\evohime-agent.ico', 'evohime-core.exe', 'evohime-supervisor.exe', 'evohime-listener.exe', 'evohime-transaction.exe', 'evohime-verify.exe', 'evohime.manifest.json', 'evohime.components.json', 'evohime.build.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $installPath $component))) { throw "Installed component missing: $component" }
          }
          # Маркер сборки — то, по чему установленный клиент понимает, отстал ли он от ветки.
          $marker = Get-Content -LiteralPath (Join-Path $installPath 'evohime.build.json') -Raw | ConvertFrom-Json
          if ($marker.commit -ne $env:GITHUB_SHA) { throw "Build marker commit mismatch: $($marker.commit)" }
          # Установщик пишет конфигурацию обновления в профиль пользователя.
          $updateConfig = Join-Path $env:LOCALAPPDATA 'EvoHime\update.json'
          if (-not (Test-Path -LiteralPath $updateConfig)) { throw 'Installer did not write update.json.' }
          $update = Get-Content -LiteralPath $updateConfig -Raw | ConvertFrom-Json
          if ($update.branch -ne 'main') { throw "Unexpected update branch: $($update.branch)" }
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$installPath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $installPath 'EvoHime.exe'))) { throw 'Upgrade removed the client executable.' }
      - name: Smoke отката после ошибки запуска установщика
        shell: pwsh
        run: |
          $rollbackPath = Join-Path $env:RUNNER_TEMP 'EvoHime-rollback-smoke'
          $statePath = Join-Path $rollbackPath 'state'
          New-Item -ItemType Directory -Force -Path $rollbackPath | Out-Null
          foreach ($component in @('EvoHime.exe', 'evohime-core.exe', 'evohime-supervisor.exe', 'evohime.manifest.json')) {
            Set-Content -LiteralPath (Join-Path $rollbackPath $component) -Value "before:$component"
          }
          $before = (Get-FileHash (Join-Path $rollbackPath 'EvoHime.exe')).Hash
          $updater = Join-Path $env:GITHUB_WORKSPACE 'native-package\evohime-transaction.exe'
          $failedInstaller = Join-Path $rollbackPath 'missing-installer.exe'
          $process = Start-Process -FilePath $updater -ArgumentList @(
            '--worker',
            '--installer', $failedInstaller,
            '--install-dir', $rollbackPath,
            '--state-dir', $statePath
          ) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -eq 0) { throw 'Failed installer must return a non-zero exit code.' }
          $after = (Get-FileHash (Join-Path $rollbackPath 'EvoHime.exe')).Hash
          if ($before -ne $after) { throw 'Rollback did not restore the previous client.' }
          if (Test-Path -LiteralPath (Join-Path $statePath 'transaction.json')) { throw 'Rollback left a transaction journal.' }
      - name: Smoke применения staged rebuild
        shell: pwsh
        run: |
          # Обновление без релиза: клиент пересобирает продукт локально и отдаёт
          # готовый пакет transaction worker'у. Здесь проверяется сам обмен.
          $root = Join-Path $env:RUNNER_TEMP 'EvoHime-staged-smoke'
          $installPath = Join-Path $root 'install'
          $stagingPath = Join-Path $root 'staging'
          $statePath = Join-Path $root 'state'
          New-Item -ItemType Directory -Force -Path $installPath, $stagingPath | Out-Null
          foreach ($component in @('EvoHime.exe', 'evohime-core.exe', 'evohime-supervisor.exe', 'evohime.manifest.json')) {
            Set-Content -LiteralPath (Join-Path $installPath $component) -Value "before:$component"
            Set-Content -LiteralPath (Join-Path $stagingPath $component) -Value "after:$component"
          }
          Set-Content -LiteralPath (Join-Path $installPath 'user-data.txt') -Value 'keep'
          $updater = Join-Path $env:GITHUB_WORKSPACE 'native-package\evohime-transaction.exe'
          $process = Start-Process -FilePath $updater -ArgumentList @(
            '--worker',
            '--apply-staging',
            '--staging', $stagingPath,
            '--install-dir', $installPath,
            '--state-dir', $statePath
          ) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Staged apply failed with exit code $($process.ExitCode)." }
          if ((Get-Content -LiteralPath (Join-Path $installPath 'EvoHime.exe') -Raw).Trim() -ne 'after:EvoHime.exe') {
            throw 'Staged package was not installed.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $installPath 'user-data.txt'))) { throw 'Staged apply removed local files.' }
          if (Test-Path -LiteralPath (Join-Path $statePath 'transaction.json')) { throw 'Staged apply left a transaction journal.' }

          # Неполный пакет не должен трогать установку.
          Remove-Item -LiteralPath (Join-Path $stagingPath 'evohime-core.exe') -Force
          $failed = Start-Process -FilePath $updater -ArgumentList @(
            '--worker',
            '--apply-staging',
            '--staging', $stagingPath,
            '--install-dir', $installPath,
            '--state-dir', $statePath
          ) -Wait -PassThru -NoNewWindow
          if ($failed.ExitCode -eq 0) { throw 'Incomplete staged package must fail.' }
          if ((Get-Content -LiteralPath (Join-Path $installPath 'EvoHime.exe') -Raw).Trim() -ne 'after:EvoHime.exe') {
            throw 'Refused apply must leave the installation untouched.'
          }

      - name: Smoke выборочного UI component apply
        shell: pwsh
        run: ./scripts/component-update.tests.ps1 -UpdaterPath "$env:GITHUB_WORKSPACE\native-package\evohime-transaction.exe"

      - name: Запись manifest установщика
        shell: pwsh
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE 'installer-output\EvoHime-Setup.exe'
          $manifest = [ordered]@{
            version = 1
            product = 'EvoHime'
            asset = 'EvoHime-Setup.exe'
            commit = $env:GITHUB_SHA
            branch = 'main'
            size = (Get-Item -LiteralPath $setup).Length
            sha256 = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'installer-output\EvoHime-Setup.json') -Encoding utf8NoBOM

      # Установщик нужен для первой установки и фоновых обновлений клиента.
      # Каждый прогон оставляет его артефактом, а на main он также попадает в
      # постоянный Release после успешной проверки.
      - name: Загрузка единственного установщика
        uses: actions/upload-artifact@v7
        with:
          name: evohime-windows-installer
          path: |
            installer-output\EvoHime-Setup.exe
            installer-output\EvoHime-Setup.json
            native-package\evohime.components.json
            native-package\EvoHime.exe
            native-package\evohime-core.exe
            native-package\evohime-supervisor.exe
            native-package\eva.exe
            native-package\evohime-analysis-worker.exe
            native-package\evohime-listener.exe
            native-package\evohime-transaction.exe
            native-package\evohime-verify.exe
          if-no-files-found: error

  # Один постоянный релиз с фиксированным тегом: файл в нём перезаписывается,
  # новых релизов и версионных тегов не появляется. Права на запись есть только
  # у этого job после успешной сборки из main или ручного запуска workflow.
  publish-installer:
    name: Публикация
    needs: build-native
    if: >-
      !cancelled()
      && needs.build-native.result == 'success'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: installer
      RELEASE_TITLE: EvoHime — установщик
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: evohime-windows-installer
          # Артефакт содержит installer-output/ и native-package/ относительно
          # workspace: upload-artifact получил несколько путей из корня.
          path: .
      - name: Обновление единственного release установщика
        shell: pwsh
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE 'installer-output\EvoHime-Setup.exe'
          $manifest = [ordered]@{
            version = 1
            product = 'EvoHime'
            asset = 'EvoHime-Setup.exe'
            commit = $env:GITHUB_SHA
            branch = 'main'
            size = (Get-Item -LiteralPath $setup).Length
            sha256 = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'installer-output\EvoHime-Setup.json') -Encoding utf8NoBOM
          $notes = 'installer/release-notes.md'
          gh release view $env:RELEASE_TAG 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            # Релиз создаётся один раз — только если его вообще нет.
            gh release create $env:RELEASE_TAG --title $env:RELEASE_TITLE --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Не удалось создать релиз установщика.' }
          }
          else {
            gh release edit $env:RELEASE_TAG --title $env:RELEASE_TITLE --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Не удалось обновить описание релиза.' }
          }
          gh release upload $env:RELEASE_TAG installer-output\EvoHime-Setup.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось загрузить установщик.' }
          gh release upload $env:RELEASE_TAG installer-output\EvoHime-Setup.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось загрузить манифест установщика.' }
          $componentManifest = Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter 'evohime.components.json' -Recurse | Select-Object -First 1
          if ($null -eq $componentManifest) { throw 'Component manifest artifact is missing.' }
          gh release upload $env:RELEASE_TAG $componentManifest.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось загрузить component manifest.' }
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter '*.exe' -Recurse |
            Where-Object { $_.Name -in @('EvoHime.exe', 'evohime-core.exe', 'evohime-supervisor.exe', 'eva.exe', 'evohime-analysis-worker.exe', 'evohime-listener.exe', 'evohime-transaction.exe', 'evohime-verify.exe') } |
            ForEach-Object {
              gh release upload $env:RELEASE_TAG $_.FullName --clobber
              if ($LASTEXITCODE -ne 0) { throw "Не удалось загрузить component artifact: $($_.Name)" }
            }
          Write-Host "Установщик обновлён в релизе $env:RELEASE_TAG"
          exit 0
