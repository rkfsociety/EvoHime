name: media-voice module

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/evohime-media-voice/**'
      - 'crates/evohime-service-contract/**'
      - 'release-versions/media-voice.txt'
      - '.github/workflows/media-voice.yml'
      - '.github/workflows/module-native.yml'

concurrency:
  group: evohime-module-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  module:
    uses: ./.github/workflows/module-native.yml
    permissions: { contents: write }
    with:
      module: media-voice
      package: evohime-media-voice
      artifact: evohime-media-voice.exe
      version_file: release-versions/media-voice.txt
