name: analysis-worker module
on:
  workflow_call:
  pull_request:
    paths: ['crates/evohime-supervisor/**', 'release-versions/analysis-worker.txt', '.github/workflows/analysis-worker.yml', '.github/workflows/module-native.yml']
jobs:
  module:
    uses: ./.github/workflows/module-native.yml
    permissions: { contents: write }
    with: { module: analysis-worker, package: evohime-supervisor, artifact: evohime-analysis-worker.exe, version_file: release-versions/analysis-worker.txt }
