name: web installer

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'installer/EvoHime.iss'
      - 'installer/release-notes.md'
      - 'scripts/build-installer-source.ps1'
      - 'scripts/installer-content.tests.ps1'
      - 'scripts/installer-release.tests.ps1'
      - 'scripts/publish-installer-release.ps1'
      - 'release-versions/installer.txt'
      - '.github/workflows/installer.yml'

concurrency:
  group: evohime-web-installer
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: web installer — build and smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Download published self-contained updater module
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $updaterVersion = (Get-Content -LiteralPath 'release-versions\updater.txt' -Raw).Trim()
          if ($updaterVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid updater version.' }
          New-Item -ItemType Directory -Force -Path module-input | Out-Null
          gh release download "module-updater-v$updaterVersion" --repo $env:GITHUB_REPOSITORY --pattern updater.zip --dir module-input --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Published updater module is unavailable.' }
          ./scripts/build-installer-source.ps1 -UpdaterArchivePath module-input/updater.zip -OutputPath installer-source -UpdaterVersion $updaterVersion -Commit $env:GITHUB_SHA -Branch main
      - name: Проверка содержимого web installer
        shell: pwsh
        run: ./scripts/installer-release.tests.ps1; ./scripts/installer-content.tests.ps1 -SourcePath installer-source
      - name: Установка Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Сборка web installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC not found: $iscc" }
          $version = (Get-Content -LiteralPath 'release-versions\installer.txt' -Raw).Trim()
          & $iscc "/Oinstaller-output" "/DSourceDir=$env:GITHUB_WORKSPACE\installer-source" "/DAppVersion=$version" installer/EvoHime.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Проверка собранного installer
        shell: pwsh
        run: ./scripts/installer-content.tests.ps1 -SourcePath installer-source -SetupPath installer-output/EvoHime-Setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: evohime-web-installer
          path: installer-output/EvoHime-Setup.exe
          if-no-files-found: error

  publish:
    name: web installer — release
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: evohime-web-installer
          path: installer-output
      - name: Publish web installer release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-installer-release.ps1 -SetupPath installer-output/EvoHime-Setup.exe -Version ((Get-Content -LiteralPath 'release-versions\installer.txt' -Raw).Trim()) -Commit $env:GITHUB_SHA
