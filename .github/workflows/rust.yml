name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Stage 7.87 — formatting gate for the complete Rust workspace.
      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, nightly]
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evohime
          POSTGRES_PASSWORD: evohime
          POSTGRES_DB: evohime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evohime -d evohime"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Stage 7.84: run storage/memory/task-engine integration tests against Postgres.
      DATABASE_URL: postgres://evohime:evohime@localhost:5432/evohime
      EVOHIME_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run tests
        run: cargo test --workspace --all-features --all-targets

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Stage 7.87 — rustdoc warnings are CI failures.
      - name: Build Rust docs with warnings denied
        run: cargo doc --workspace --all-features --no-deps

  # Stage 7.85 — frontend typecheck + production build (Playwright smoke deferred).
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  # Stage 7.86 — fail when generated protocol types drift from the schema.
  protocol-drift:
    name: Protocol Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend/web
        run: npm ci
      - name: Install protocol generator dependencies
        run: npm ci
      - name: Regenerate protocol types
        run: npm run generate:protocol
      - name: Check generated protocol types are committed
        run: git diff --exit-code -- frontend/web/src/protocol.generated.ts

  # Stage 7.89 — generated OpenAPI route inventory and typed path union.
  openapi-drift:
    name: OpenAPI Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install generator dependencies
        run: npm ci
      - name: Regenerate OpenAPI contract and typed paths
        run: npm run generate:openapi
      - name: Check generated OpenAPI files are committed
        run: git diff --exit-code -- docs/openapi.json frontend/web/src/api/generated.ts

  # Stage 7.56 — Python worker unit/integration tests.
  python-worker:
    name: Python Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run worker tests
        run: python -m unittest discover -s workers/python -p "test_*.py"
