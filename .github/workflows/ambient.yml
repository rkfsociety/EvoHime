name: ambient module

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/evohime-ambient/**'
      - 'crates/evohime-service-contract/**'
      - 'release-versions/ambient.txt'
      - '.github/workflows/ambient.yml'
      - '.github/workflows/module-native.yml'

concurrency:
  group: evohime-module-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  module:
    uses: ./.github/workflows/module-native.yml
    permissions: { contents: write }
    with:
      module: ambient
      package: evohime-ambient
      artifact: evohime-ambient.exe
      version_file: release-versions/ambient.txt
