name: updater module

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/evohime-update-agent/**'
      - 'release-versions/updater.txt'
      - '.github/workflows/update-agent.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: evohime-module-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: updater — tests and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p evohime-update-agent
      - run: cargo clippy --locked -p evohime-update-agent --all-targets -- -D warnings
      - run: cargo build --locked --release -p evohime-update-agent
      - uses: actions/upload-artifact@v7
        with:
          name: module-updater
          path: target/release/evohime-updater.exe
          if-no-files-found: error

  publish:
    name: updater — release
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: module-updater
          path: updater-output
      - name: Publish updater release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath 'release-versions/updater.txt' -Raw).Trim()
          ./scripts/module-release.ps1 -Module updater -Version $version -Artifact (Join-Path $env:GITHUB_WORKSPACE 'updater-output\evohime-updater.exe') -Summary 'Независимый агент проверки и координации модульных обновлений.'
