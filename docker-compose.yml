services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evohime
      POSTGRES_USER: evohime
      POSTGRES_PASSWORD: evohime
    ports:
      - "5432:5432"
    volumes:
      - evohime_db:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      DATABASE_URL: postgres://evohime:evohime@db:5432/evohime
      BIND_ADDR: 0.0.0.0:3000
      WORKSPACE_ROOT: /workspace
      DEMO_FILE_PATH: /workspace/docs/sample-context.md
      MODEL_PROVIDER: literouter
      LITEROUTER_BASE_URL: https://api.literouter.com/v1
      LITEROUTER_MODEL: deepseek:free
      LITEROUTER_API_KEY: ${LITEROUTER_API_KEY:-}
    volumes:
      - ./:/workspace
    ports:
      - "3000:3000"
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://server:3000
      VITE_API_BASE_URL: http://localhost:3000
    volumes:
      - ./:/workspace
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  evohime_db:
