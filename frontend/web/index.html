<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>EvoHime</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Плейсхолдер токена сессии Launcher'а (раздел XV плана
      Installer/Launcher/Update). Static file server Launcher'а
      подставляет реальный токен в этот тег при каждой раздаче index.html
      "на лету" — токен никогда не попадает в собранный JS-бандл на диске.
      Вне Launcher'а (обычный dev через Vite/npm run dev, или прод-сборка
      без Launcher'а) строка остаётся плейсхолдером, и LauncherStatus
      просто не находит токен — панель показывает "Launcher недоступен".
    -->
    <script>window.__EVOHIME_TOKEN__ = "__EVOHIME_TOKEN_PLACEHOLDER__";</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
