<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      The packaged renderer is loaded over file://, where response headers do not
      apply, so this meta policy is the enforced CSP. The session also sets the
      same policy on every response it can (plan 0, stage 2).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvoHime</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
