[package]
name = "evohime-artifacts"
version = "0.1.0"
edition = "2021"

[lib]
name = "evohime_artifacts"
path = "src/lib.rs"

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
  "fs",
  "macros",
  "rt-multi-thread",
  "io-util",
  "net",
] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = "0.7"
tempfile = "3"
tower-http = { version = "0.6", features = ["fs"] }
