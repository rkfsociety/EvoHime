[package]
name = "evohime-local-storage"
version = "0.1.0"
publish = false
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
evohime-context-budget = { path = "../context-budget" }
evohime-listener-contract = { path = "../evohime-listener-contract" }
evohime-receipts = { path = "../evohime-receipts" }
evohime-model-provenance = { path = "../evohime-model-provenance" }
rusqlite = { version = "0.32.1", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v7"] }
