syntax = "proto3";
package evohime.listener;

message Hello { uint32 protocol_major = 1; string client_id = 2; string role = 3; }
message Handshake { string nonce = 1; string proof = 2; }
// Тихие часы приезжают парой параллельных списков минут суток: окно i — это
// [quiet_start[i], quiet_end[i]). Отдельным сообщением их делать нечем — у
// листенера нет своего типа окна, он берёт его из контракта 04.1.
message PolicyUpdate { bool paused = 1; repeated string process_blocklist = 2; repeated string window_title_blocklist = 3; repeated uint32 quiet_start = 4; repeated uint32 quiet_end = 5; bool enabled = 6; string device_id = 7; }
message StateChanged { string state = 1; string reason = 2; string device_id = 3; }
message UtteranceRecognized { string episode_id = 1; string text = 2; uint64 started_at_ms = 3; bool continued = 4; uint32 sequence = 5; uint32 duration_ms = 6; string language = 7; }
message EngineStatus { string status = 1; string version = 2; string code = 3; }
message CaptureDevice { string device_id = 1; string display_name = 2; bool is_default = 3; }
// Снимок списка устройств. `watching=false` означает, что подписка на
// WM_DEVICECHANGE не поднялась и снимок больше сам не обновится — об этом
// UI обязан сказать, а не показывать список как живой.
message DeviceList { repeated CaptureDevice devices = 1; string active_device_id = 2; bool watching = 3; }
message LocalCommand { oneof command { bool pause = 1; bool reset_buffers = 2; string select_device = 3; bool enabled = 4; } }
message Envelope { oneof payload { Hello hello = 1; Handshake handshake = 2; PolicyUpdate policy = 3; StateChanged state = 4; UtteranceRecognized utterance = 5; EngineStatus engine = 6; LocalCommand command = 7; DeviceList devices = 8; } }
