[package]
name = "evohime-core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "evohime-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
evohime-model-gateway = { path = "../model-gateway" }
evohime-tool-runtime = { path = "../tool-runtime" }
evohime-permissions = { path = "../permissions" }
futures-util = "0.3"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
