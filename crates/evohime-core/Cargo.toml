[package]
name = "evohime-core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "evohime-core"
path = "src/main.rs"

[[bin]]
name = "kill9-worker-test-helper"
path = "tests/bin/kill9_worker.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
evohime-context-budget = { path = "../context-budget" }
evohime-model-gateway = { path = "../model-gateway" }
evohime-tool-runtime = { path = "../tool-runtime" }
evohime-permissions = { path = "../permissions" }
evohime-local-storage = { path = "../evohime-local-storage" }
evohime-desktop-ipc = { path = "../desktop-ipc" }
evohime-receipts = { path = "../evohime-receipts" }
prost = "0.14"
futures-util = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "stream"] }
tracing = "0.1"
rusqlite = { version = "0.32.1", features = ["bundled", "hooks"] }
ring = "0.17"
unicode-normalization = "0.1"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
