[package]
name = "evohime-core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "evohime-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
evohime-model-gateway = { path = "../model-gateway" }
evohime-tool-runtime = { path = "../tool-runtime" }
evohime-permissions = { path = "../permissions" }
evohime-local-storage = { path = "../evohime-local-storage" }
evohime-desktop-ipc = { path = "../desktop-ipc" }
prost = "0.14"
futures-util = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
