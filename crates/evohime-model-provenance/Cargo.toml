[package]
name = "evohime-model-provenance"
version = "0.1.0"
edition = "2021"

[dependencies]
evohime-receipts = { path = "../evohime-receipts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
hex = "0.4"
