[package]
name = "evohime-hive"
version = "0.1.0"
publish = false
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
evohime-hive-contract = { path = "../evohime-hive-contract" }
evohime-model-gateway = { path = "../model-gateway" }
evohime-permissions = { path = "../permissions" }
evohime-tool-runtime = { path = "../tool-runtime" }

tokio = { workspace = true, features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "evohime-hive-daemon"
path = "src/bin/daemon.rs"
