[package]
name = "evohime-hive"
version = "0.1.0"
publish = false
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
evohime-desktop-ipc = { path = "../desktop-ipc" }
evohime-hive-contract = { path = "../evohime-hive-contract" }
evohime-model-gateway = { path = "../model-gateway" }
evohime-permissions = { path = "../permissions" }
evohime-tool-runtime = { path = "../tool-runtime" }

prost = "0.14"
rusqlite = { version = "0.43", features = ["backup", "bundled", "fallible_uint"] }
tokio = { workspace = true, features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "evohime-hive-daemon"
path = "src/bin/daemon.rs"
