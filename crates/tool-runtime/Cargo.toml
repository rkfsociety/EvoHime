[package]
name = "evohime-tool-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
evohime-permissions = { path = "../permissions" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
base64 = "0.22"
jsonschema = { version = "0.18", default-features = false }
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_JobObjects"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
