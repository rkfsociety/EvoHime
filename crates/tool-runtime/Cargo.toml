[package]
name = "evohime-tool-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
evohime-permissions = { path = "../permissions" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
