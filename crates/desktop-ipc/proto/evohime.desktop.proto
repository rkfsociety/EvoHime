syntax = "proto3";

package evohime.desktop.v1;

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

// Additive negotiation fixture. Existing Handshake envelopes continue to
// carry the same capability list; this message gives newer peers a bounded
// standalone offer without changing legacy message layouts.
message ProtocolOffer {
  ProtocolVersion protocol = 1;
  repeated string capabilities = 2;
}

message Handshake {
  ProtocolVersion protocol = 1;
  string client_id = 2;
  string session_id = 3;
  uint64 session_epoch = 4;
  uint64 last_event_sequence = 5;
  repeated string capabilities = 6;
  // Additive session authentication (see evohime_desktop_ipc::session).
  // client_role is one of the transport-accepted roles; nonce echoes the
  // single-use value Core issued on this connection, and proof is
  // HMAC-SHA256(session secret, role | client_id | nonce). A Core started
  // without a launch context keeps accepting legacy handshakes and logs the
  // connection as unauthenticated.
  string client_role = 7;
  string nonce = 8;
  string proof = 9;
}

// Sent by Core immediately after a client connects, before any command is
// accepted. The nonce is single-use and expires; a replayed or late answer is
// rejected without mutating any state.
message AuthChallenge {
  string nonce = 1;
  uint64 expires_at_ms = 2;
}

message ReplayEvents {
  uint64 after_sequence = 1;
}

// Additive bounded replay request. A zero max_events means the receiver uses
// its bounded default; values above the receiver limit must be rejected.
message ResyncRequest {
  uint64 after_sequence = 1;
  uint32 max_events = 2;
  bool include_full_snapshot = 3;
}

message ModelConfigRequest {}

message ModelCatalogRequest {
  string mode = 1;
}

// Selects the model used for the next request. The gateway resolves the model
// per call, so this takes effect without restarting Core. An empty value
// returns to the model the route is configured with.
message SelectModelRequest {
  string model = 1;
}

// Starts a read-only multi-model plan review. The source is supplied as
// bounded UTF-8 Markdown by the Electron main process; Core owns execution and
// persistence and never exposes provider credentials to the shell.
message StartPlanReview {
  string review_id = 1;
  string file_name = 2;
  string source_markdown = 3;
  repeated string reviewer_models = 4;
  string synthesis_model = 5;
  repeated string file_names = 6;
  // Absolute paths of the reviewed files. Core follows the Markdown links
  // inside them to read the neighbouring plans a stage relies on, so a review
  // can say that a plan contradicts the stage next door. Empty when the plan
  // came from a source without a filesystem: the review then runs blind, as
  // it did before.
  repeated string source_paths = 7;
}

message StopPlanReview {
  string review_id = 1;
}

message ListPlanReviews {
  uint32 limit = 1;
}

message GetPlanReview {
  string review_id = 1;
}

message ExportPlanReview {
  string review_id = 1;
  string destination_path = 2;
  bool include_reviewers = 3;
}

// Hides earlier reviews from the history list. The journal stays append-only:
// clearing records a marker, and listing ignores everything recorded before it.
message ClearPlanReviewHistory {}

// Rewrites the plan a finished review was made for. The shell resends the plan
// because Core keeps only the review itself; the rewritten plan is held in
// memory until SaveRevisedPlan, so nothing reaches disk without a second
// deliberate step.
message RevisePlan {
  string revision_id = 1;
  string review_id = 2;
  string file_name = 3;
  string source_markdown = 4;
  string model = 5;
  // Absolute path of the plan being revised; the editor gets the same linked
  // plans the reviewer saw. Without them a revision reads well on its own and
  // still breaks the invariant of a neighbouring stage.
  string source_path = 6;
}

message StopRevision {
  string revision_id = 1;
}

message SaveRevisedPlan {
  string revision_id = 1;
  string destination_path = 2;
}

message PermissionModeRequest {
  string mode = 1;
}

enum TaskStatus {
  TASK_STATUS_UNKNOWN = 0;
  TASK_STATUS_BACKLOG = 1;
  TASK_STATUS_READY = 2;
  TASK_STATUS_IN_PROGRESS = 3;
  TASK_STATUS_DONE = 4;
}

message CreateProject {
  string project_id = 1;
  string title = 2;
  string workspace_path = 3;
  string source_ref = 4;
}

message CreateTask {
  string task_id = 1;
  string project_id = 2;
  string parent_id = 3;
  string title = 4;
  string description = 5;
  string source_ref = 6;
  string acceptance_criteria = 7;
  string non_goals = 8;
  string status = 9;
  int64 priority = 10;
  int64 estimate = 11;
  string complexity = 12;
  TaskStatus status_code = 13;
}

message UpdateTaskStatus {
  string task_id = 1;
  int64 expected_version = 2;
  string status = 3;
}

message AddTaskEdge {
  string from_task_id = 1;
  string to_task_id = 2;
  string kind = 3;
}

message GetTaskGraph {
  string project_id = 1;
}

message NextReadyTask {
  string project_id = 1;
}

message ImportPrd {
  string import_id = 1;
  string project_id = 2;
  string origin = 3;
  string version = 4;
  string source_text = 5;
}

message GetTaskHistory {
  string task_id = 1;
  uint32 limit = 2;
}

message GetTaskContext {
  string project_id = 1;
  string task_id = 2;
  uint32 max_chars = 3;
}

message GetTaskPlanSpec {
  string project_id = 1;
  string task_id = 2;
  uint32 max_chars = 3;
}

message ApplyApprovedBuild {
  string project_id = 1;
  bytes approved_build_json = 2;
  string run_id = 3;
  string task_id = 4;
}

message PrepareBuild {
  string project_id = 1;
  bytes proposal_json = 2;
}

message GetTaskSnapshot {
  string project_id = 1;
  string task_id = 2;
}

message RestoreTaskSnapshot {
  string project_id = 1;
  string task_id = 2;
  string snapshot_id = 3;
}

// Bounded, read-only projection of the Core-owned TaskCheckpoint contract.
// It deliberately contains counts and metadata rather than prompt, raw
// context, credentials, hidden reasoning or tool output.
message GetTaskCheckpoint {
  string task_id = 1;
  string workspace_path = 2;
  uint32 max_replay_events = 3;
}

message ResolveTaskCheckpoint {
  string task_id = 1;
  string workspace_path = 2;
  string checkpoint_id = 3;
  int64 expected_source_event_seq = 4;
  string action = 5;
  string idempotency_key = 6;
}

// Bounded metadata catalog for local SKILL.md packages. The catalog never
// contains the full skill body or executable helper content.
message ListSkills {
  string workspace_path = 1;
  uint32 limit = 2;
}

// Explicit progressive-disclosure request. Loading a skill is a read-only
// operation; Core rechecks the current file hash before returning its body.
message LoadSkill {
  string workspace_path = 1;
  string skill_id = 2;
  uint32 max_bytes = 3;
}

// Explicit read of one bounded file below a skill's references/ directory.
message LoadSkillReference {
  string workspace_path = 1;
  string skill_id = 2;
  string reference = 3;
  uint32 max_bytes = 4;
}

message SkillMetadataProjection {
  uint32 schema_version = 1;
  string skill_id = 2;
  string name = 3;
  string description = 4;
  string version = 5;
  string scope = 6;
  string source_kind = 7;
  string source_ref = 8;
  string content_hash = 9;
  repeated string allowed_tools = 10;
  repeated string required_capabilities = 11;
  bool disable_model_invocation = 12;
  uint32 reference_count = 13;
  string validation_status = 14;
  string validation_error_code = 15;
  repeated string warnings = 16;
}

message SkillDiagnosticProjection {
  string code = 1;
  string skill_id = 2;
  string source_kind = 3;
  string source_ref = 4;
  string message = 5;
}

message SkillCatalogProjection {
  uint32 schema_version = 1;
  repeated SkillMetadataProjection skills = 2;
  repeated SkillDiagnosticProjection diagnostics = 3;
}

message SkillContentResult {
  uint32 schema_version = 1;
  string skill_id = 2;
  string version = 3;
  string content = 4;
  string content_hash = 5;
  string source_ref = 6;
  string error_code = 7;
  string error_message = 8;
  bool cache_hit = 9;
}

message SkillReferenceResult {
  uint32 schema_version = 1;
  string skill_id = 2;
  string reference = 3;
  string content = 4;
  string content_hash = 5;
  string source_ref = 6;
  string error_code = 7;
  string error_message = 8;
}

message TaskCheckpointRef {
  string kind = 1;
  string id = 2;
  string content_hash = 3;
  string sensitivity = 4;
}

message TaskCheckpointProjection {
  uint32 schema_version = 1;
  string checkpoint_id = 2;
  string task_id = 3;
  string workspace_id = 4;
  string parent_checkpoint_id = 5;
  string status = 6;
  int64 source_event_seq = 7;
  int64 created_at = 8;
  uint32 completed_count = 9;
  uint32 remaining_count = 10;
  uint32 blocker_count = 11;
  repeated string blockers = 12;
  repeated TaskCheckpointRef refs = 13;
  string recovery_disposition = 14;
  string recovery_warning = 15;
  repeated string replayed_event_types = 16;
  bool can_request_resume = 17;
  uint32 replayed_event_count = 18;
  string policy_id = 19;
  string error_code = 20;
}

message TaskCheckpointActionResult {
  string task_id = 1;
  string checkpoint_id = 2;
  string action = 3;
  bool applied = 4;
  bool deduplicated = 5;
  string error_code = 6;
  string error_message = 7;
  uint64 sequence_id = 8;
}

message GetBuildPolicy {
  string project_id = 1;
}

message SaveBuildPolicy {
  string project_id = 1;
  bytes policy_json = 2;
  int64 expected_version = 3;
}

message StartTask {
  string task_id = 1;
  string prompt = 2;
  string workspace_path = 3;
  // Non-privileged route hint; Core policy remains authoritative.
  string preferred_route_hint = 4;
  // Explicit task intent. Empty/unknown values remain dialogue for compatibility.
  string execution_kind = 5;
}

// Bounded read-only workspace browsing for the native Files surface.
message ListWorkspace {
  string workspace_path = 1;
  string relative_path = 2;
  uint32 max_entries = 3;
}

message ReadWorkspaceFile {
  string workspace_path = 1;
  string relative_path = 2;
  uint32 max_bytes = 3;
}

// Bounded read-only Git surfaces for the native developer-tools shell.
message GitStatus {
  string workspace_path = 1;
  uint32 max_bytes = 2;
}

message GitDiff {
  string workspace_path = 1;
  string relative_path = 2;
  uint32 max_bytes = 3;
}

// Bounded shell invocation owned by Core; approval is handled by ToolRegistry.
message TerminalExecute {
  string task_id = 1;
  string workspace_path = 2;
  string program = 3;
  repeated string args = 4;
  string cwd = 5;
  uint32 timeout_ms = 6;
  string approval_id = 7;
}

message StopTask {
  string task_id = 1;
}

message ResolveApproval {
  string approval_id = 1;
  bool granted = 2;
  string idempotency_key = 3;
  string rejection_reason = 4;
  bool cancel = 5;
}

// Decision for a Core-owned route reroute. This is not a tool approval and
// cannot change permissions, sandbox or the immutable routing snapshot.
message ResolveRoutingDecision {
  string trace_id = 1;
  bool approve = 2;
}

// Receipt key lifecycle commands are accepted only on the authenticated Core
// channel. The approval id is mandatory for mutations and is never persisted
// with key material.
message RotateReceiptKey {
  string reason = 1;
  string approval_id = 2;
}

message TrustReceiptGenesis {
  string genesis_key_id = 1;
  string approval_id = 2;
  string source = 3;
}

message GetReceiptKeyStatus {}

message CreateNewReceiptGenesis {
  string approval_id = 1;
  string source = 2;
}

// Explicit authenticated closure for an action whose external result is
// unknown. The JSON is used only to recompute the exact-call hash; Core never
// persists or echoes it. This command never dispatches the original tool.
message ClosePendingReceiptAction {
  string action_id = 1;
  string input_json = 2;
  bool operator_confirmed = 3;
}

// Core-authenticated change to read-only audit sampling. Renderer input is
// bounded and cannot modify the SQLite setting directly.
message SetReceiptAuditSamplingRate {
  uint32 rate = 1;
}

// Authenticated read-only reconciliation of a pending external mutation.
// Core creates a new action and never dispatches the original action again.
message ReconcilePendingReceiptAction {
  string old_action_id = 1;
  string tool_name = 2;
  string input_json = 3;
  string workspace_path = 4;
}

// Authenticated manual closure for an invariant-violating quarantined action.
// This command can only produce a signed recovery refusal; it never resumes
// or dispatches the original action.
message UnquarantineReceiptAction {
  string action_id = 1;
  string input_json = 2;
  bool operator_confirmed = 3;
  string checkpoint = 4;
}

// Stage 01.4: read-only, bounded chain listing. Roles shell and
// compatibility-shell only; Core never returns raw canonical payload here.
message ListReceipts {
  string task_id = 1;
  string run_id = 2;
  string action_id = 3;
  string from_rfc3339 = 4;
  string to_rfc3339 = 5;
  uint32 limit = 6;
}

// Stage 01.4: synchronous, bounded verify-chain over the closure of the
// filtered range. Larger verification belongs to the offline verifier.
message VerifyReceipts {
  string task_id = 1;
  string run_id = 2;
  string action_id = 3;
  string from_rfc3339 = 4;
  string to_rfc3339 = 5;
  uint32 limit = 6;
  string trust_key_id = 7;
}

// Stage 01.4: atomic JSONL export bundle to a shell-selected destination
// directory. `replace` must remain false in v1.
message ExportReceipts {
  string destination_path = 1;
  string task_id = 2;
  string run_id = 3;
  string action_id = 4;
  string from_rfc3339 = 5;
  string to_rfc3339 = 6;
  uint32 limit = 7;
  bool replace = 8;
}

// Bounded, read-only Core Doctor diagnostic. project_id is optional; when
// set, the permissions check is grounded in that project's real workspace.
// detail_level is user-configurable verbosity: 0 = SUMMARY (default),
// 1 = DETAILED. Both levels apply identical redaction; DETAILED only adds
// bounded, already-redacted `details` text, never secrets.
message RunDoctor {
  string project_id = 1;
  int32 detail_level = 2;
}

// Exports the local structured logs (core.jsonl / supervisor.jsonl) and
// recent run_tool_metrics aggregates, redacted, to a user-chosen JSONL file.
message ExportDoctorLogs {
  string destination_path = 1;
}

// Creates a Core-owned SQLite backup container. The response contains only
// bounded manifest metadata; progress is emitted as storage.progress events.
message CreateDatabaseBackup {
  string destination_path = 1;
}

// Reads a backup manifest and returns a one-shot approval token for restore.
message PrepareDatabaseRestore {
  string backup_path = 1;
}

// Restores a backup after the explicit approval token returned above.
message RestoreDatabase {
  string backup_path = 1;
  string approval_id = 2;
}

// Requests cooperative cancellation of an in-flight backup or restore.
message CancelDatabaseOperation {
  string operation_id = 1;
}

// Saves a single piece of offline research evidence tied to a work item.
// raw_excerpt is redacted server-side (evohime_core::research) before it is
// ever persisted or echoed back.
message SaveResearchEvidence {
  string work_item_id = 1;
  string source_kind = 2;
  string source_ref = 3;
  string title = 4;
  string publisher = 5;
  string content_type = 6;
  string raw_excerpt = 7;
  uint64 retrieved_at_ms = 8;
  uint64 ttl_ms = 9;
}

// Lists bounded research evidence records previously saved for a work item.
message ListResearchEvidence {
  string work_item_id = 1;
}

// Performs a real, policy-gated, SSRF-protected HTTP GET against `url` and
// persists the result as research evidence tied to `work_item_id`. Domain
// allowlisting, byte/latency/cost bounds are enforced server-side via
// evohime_core::research_pipeline::ResearchPolicy before any network call is
// made. This is a direct-URL fetch: no search-engine/query integration, and
// no LLM-based summarization (see evohime_core::research_fetch docs).
message RunResearchFetch {
  string work_item_id = 1;
  string url = 2;
  string title = 3;
  repeated string allowed_domains = 4;
  uint64 max_bytes = 5;
  uint64 max_latency_ms = 6;
  uint64 max_cost_micros = 7;
  uint64 ttl_ms = 8;
}

// Creates one bounded Memory v1 record (evohime_core::memory_domain
// validation and redaction run server-side before persistence). scope_kind
// is one of "project" | "task" | "workspace"; secondary_id is the task_id or
// workspace_id and must be empty for "project" scope. privacy is one of
// "public" | "internal" | "private" ("secret" is rejected: the persistent
// store has no representation for it).
message CreateMemory {
  string scope_kind = 1;
  string project_id = 2;
  string secondary_id = 3;
  string title = 4;
  string content = 5;
  string provenance_kind = 6;
  string provenance_id = 7;
  string provenance_locator = 8;
  string privacy = 9;
  uint64 ttl_ms = 10;
}

// Lists bounded, active-by-default Memory v1 records for one exact scope.
message ListMemory {
  string scope_kind = 1;
  string project_id = 2;
  string secondary_id = 3;
  bool include_archived = 4;
  uint32 limit = 5;
}

// Lexical, deterministic search over Memory v1 records for one exact scope.
message SearchMemory {
  string scope_kind = 1;
  string project_id = 2;
  string secondary_id = 3;
  string query = 4;
  uint32 limit = 5;
}

// Archives a memory record (hides it from default listings). Per the Memory
// v1 plan, archive requires an out-of-band approval token, mirroring the
// ApplyApprovedBuild trust model: approval_id proves the operation was
// already approved by the user before this request is sent.
message ArchiveMemory {
  string id = 1;
  string approval_id = 2;
}

// Permanently erases a memory record's title/content (forget). Also requires
// an out-of-band approval token; see ArchiveMemory. Writes a tombstone that
// carries only kind, scope, timestamps, a reason class and a digest.
message ForgetMemory {
  string id = 1;
  string approval_id = 2;
}

// Reads one memory record including its body. ListMemory/SearchMemory return
// metadata only; this is the single path that can carry a statement, and even
// here sensitive, forgotten and empty records come back redacted
// (body_redacted = true).
message GetMemory {
  string id = 1;
}

// Lists the pending-confirmation queue and per-state counters for one exact
// scope. Metadata only: no statement and no provenance body.
// workspace_path, when non-empty, wins over project_id/secondary_id: Core
// derives the same workspace scope id that memory extraction writes under, so
// the shell never has to reproduce that hash itself.
message ListMemoryPending {
  string scope_kind = 1;
  string project_id = 2;
  string secondary_id = 3;
  uint32 limit = 4;
  string workspace_path = 5;
}

// Deterministic conflicts between pending records and the active memory of
// the same kind + canonical_subject + scope. Reading conflicts changes
// nothing: the old entry stays active and the new one stays pending until the
// user chooses.
message GetMemoryConflicts {
  string scope_kind = 1;
  string project_id = 2;
  string secondary_id = 3;
  uint32 limit = 4;
  string workspace_path = 5;
}

// Confirms pending memory records (single or batch). approval_id proves the
// user already approved the operation, mirroring ArchiveMemory;
// idempotency_key makes a replayed request safe -- each id reports the state
// the store actually holds afterwards.
message ConfirmMemory {
  repeated string ids = 1;
  string approval_id = 2;
  string idempotency_key = 3;
}

// Rejects pending memory records (single or batch). A rejected record is
// terminal and never reopens. Same trust model as ConfirmMemory.
message RejectMemory {
  repeated string ids = 1;
  string approval_id = 2;
  string idempotency_key = 3;
}

// Edits a pending candidate before it is confirmed ("изменить"), or keeps it
// only for the current session ("только на эту сессию").
//
// When session_only is true the persistent row is rejected and the statement
// is stored as a session-scoped note with automatic expiry, so nothing enters
// long-term memory. Otherwise the edited statement replaces the candidate's
// own, which resets its confidence: a statement the user rewrote is no longer
// what the extractor proposed. Editing never confirms by itself -- the record
// stays pending until ConfirmMemory.
message ReviseMemoryCandidate {
  string id = 1;
  string statement = 2;
  bool session_only = 3;
  string session_id = 4;
  string approval_id = 5;
  string idempotency_key = 6;
}

// Resolves a conflict by an explicit user choice: old_id is superseded by
// new_id. reason is one of "user_choice" | "revalidated" | "expired" |
// "corrected". Supersede never happens automatically.
message SupersedeMemory {
  string old_id = 1;
  string new_id = 2;
  string reason = 3;
  string approval_id = 4;
  string idempotency_key = 5;
}

// Installs (or updates, when a manifest with the same name already exists)
// one bounded capability manifest (evohime_core::capability_registry) into
// the local catalog. manifest_json is the canonical JSON encoding of a
// CapabilityManifest and is validated server-side (own field bounds plus
// validate_registry/validate_update against the existing catalog) before
// persistence. install_source must be "local_archive": this first wiring
// pass only supports local-archive manifests -- "https_archive" is rejected
// because the HTTPS/signature-verifying installer is separate, larger,
// security-sensitive work that has not been built yet. source_path is the
// local archive path and is carried through for audit purposes only; this
// pass does not extract or execute archive contents.
message InstallCapability {
  string manifest_json = 1;
  string install_source = 2;
  string source_path = 3;
  // Trusted out-of-band SHA-256 of the exact HTTPS response bytes. The Core
  // never treats a manifest-declared hash as a substitute for this value.
  string expected_content_hash = 4;
}

// Lists installed capability manifests (bounded, newest-first).
message ListCapabilities {
  uint32 limit = 1;
}

// Deterministic intent/tool/domain match against the installed catalog; see
// evohime_core::capability_registry::MatchQuery.
message MatchCapabilities {
  string intent = 1;
  repeated string required_tools = 2;
  repeated string required_domains = 3;
  string requested_risk = 4;
}

// Removes one installed capability manifest by id (manifest name).
message RemoveCapability {
  string id = 1;
}

// Core-owned toolkit lifecycle. Installation/discovery never enables a tool.
message ListToolkits { uint32 limit = 1; }
message EnableToolkit { string toolkit_id = 1; string version = 2; string reason = 3; }
message DisableToolkit { string toolkit_id = 1; string version = 2; string reason = 3; }
message RollbackToolkit { string toolkit_id = 1; string version = 2; string reason = 3; }

// Requests a bounded, redacted task handoff between child roles
// (evohime_core::child_roles::HandoffEnvelope). Fields match
// HandoffEnvelope::new's parameters. from_role/to_role take a ChildRole
// name in snake_case ("coordinator", "researcher", "planner",
// "implementer", "reviewer", "tester", "custom"); when the role is
// "custom", from_name/to_name carry the bounded custom label. payload
// fields are redacted at construction time (secret-like names/values become
// "[REDACTED]") before the envelope is ever persisted. This message only
// validates and persists the envelope -- it does not deliver, accept, or
// act on the handoff for any real child agent.
message RequestChildHandoff {
  string handoff_id = 1;
  string task_id = 2;
  string kind = 3;
  string from_role = 4;
  string from_name = 5;
  string to_role = 6;
  string to_name = 7;
  string purpose = 8;
  map<string, string> payload = 9;
  uint64 sequence = 10;
}

// Lists persisted child handoffs for a task, in sequence order.
message ListChildHandoffs {
  string task_id = 1;
  uint32 limit = 2;
}

// Submits a bounded, read-only child task request
// (evohime_core::child_runtime::ChildTaskRequest) for durable storage.
// Fields match ChildTaskRequest's own fields. Server-side,
// ChildTaskRequest::validate() runs and rejects (end-to-end, not just at
// the pure-function level) any request naming a non-read-only capability
// in requested_capabilities, any request with parent_is_child = true
// (nested child delegation), or any request whose context/output exceeds
// the bounded contract limits. Accepting this request only persists a
// durable record of an approved read-only child task descriptor; Core does
// not spawn, execute, or otherwise act on it -- that remains a later,
// dedicated task.
message SubmitChildRequest {
  string child_task_id = 1;
  string parent_task_id = 2;
  string role = 3;
  string kind = 4;
  repeated string reduced_context = 5;
  uint32 max_output_bytes = 6;
  repeated string requested_capabilities = 7;
  bool parent_is_child = 8;
}

// Submits a completed child report (evohime_core::child_runtime::ChildReport)
// for acceptance and durable storage. Server-side, accept_report() runs
// against the matching persisted SubmitChildRequest: it re-validates the
// request, validates the report's own bounds, rejects secret-like content
// in the summary/findings/sources, rejects duplicate sources, and rejects a
// child_task_id mismatch between the report and its request, before
// anything is persisted.
message SubmitChildReport {
  string child_task_id = 1;
  string status = 2;
  string summary = 3;
  repeated string findings = 4;
  repeated string sources = 5;
  uint32 confidence_percent = 6;
}

// Runtime/UI wiring for the capability-registry selection
// (evohime_core::capability_selection). Runs the deterministic matcher for
// `task_id`'s query against the installed catalog, reconciles the result
// against any previously pinned/replaced selection persisted for the same
// task_id (evohime_local_storage::capability_selection_store), and returns
// the reconciled CapabilitySelectionState (manifest/version/reasons/risk/
// tools/acceptance criteria/origin) as JSON. The reconciled state is
// persisted so it survives reconnect.
message GetCapabilitySelection {
  string task_id = 1;
  string intent = 2;
  repeated string required_tools = 3;
  repeated string required_domains = 4;
  string requested_risk = 5;
}

// Pins the selection currently persisted for task_id so future
// GetCapabilitySelection calls cannot silently swap it for a higher-scoring
// auto-match. Fails if no selection has been recorded for task_id yet (call
// GetCapabilitySelection first).
message PinCapabilitySelection {
  string task_id = 1;
}

// Explicitly switches the selection persisted for task_id to
// manifest_name, re-deriving permissions/reasons against the same query so
// the UI never shows stale grants (evohime_core::capability_selection::
// replace). Rejects a manifest_name outside the registry or outside the
// query's own risk/tool/domain bounds.
message ReplaceCapabilitySelection {
  string task_id = 1;
  string manifest_name = 2;
  string intent = 3;
  repeated string required_tools = 4;
  repeated string required_domains = 5;
  string requested_risk = 6;
}

// Submits one bounded, redacted feedback record (useful/not-useful signal,
// optional correction, optional rejection reason) about an existing run's
// tool result or approval decision. run_id/task_id/subject_ref must
// correlate to identifiers already threaded through the audit trail
// (runs.id, task id, effect/approval id) -- this does not mint a new
// correlation id. signal is one of "useful" | "not_useful" | "neutral".
// Feedback is local-only: see evohime_local_storage::feedback_store::
// external_telemetry_allowed for the (default-closed) opt-in gate any
// future external telemetry send must check.
message SubmitFeedback {
  string run_id = 1;
  string task_id = 2;
  string subject_ref = 3;
  string signal = 4;
  string correction = 5;
  string rejection_reason = 6;
  string outcome = 7;
}

// Lists feedback for one run (newest first) plus a simple local aggregation
// (signal counts, top rejection reasons/outcomes by frequency).
message ListFeedback {
  string run_id = 1;
  uint32 limit = 2;
}

// Local Agentic RAG commands. The path is the already selected workspace;
// Core canonicalizes and checks it again before any filesystem access.
message IndexWorkspace {
  string workspace_path = 1;
  bool enable_embeddings = 2;
}

message RebuildIndex {
  string workspace_path = 1;
  bool enable_embeddings = 2;
}

message SearchWorkspaceKnowledge {
  string workspace_path = 1;
  string query = 2;
  string path_filter = 3;
  string language_filter = 4;
  bool hybrid = 5;
}

message GetIndexStatus {
  string workspace_path = 1;
}

message CancelWorkspaceIndex {
  string workspace_path = 1;
}

// План 01.5: read-only проекция состава контекста последних model call задачи.
// Возвращает только ids, счётчики, причины и context_ledger_hash -- ни сырого
// prompt, ни тела памяти, ни raw tool output.
message GetContextLedger {
  string task_id = 1;
  uint32 limit = 2;
}

// Bounded чтение scratchpad задачи с фильтром по категории и статусу.
// Пустые category/status означают "без фильтра".
message ListTaskScratchpad {
  string task_id = 1;
  string category = 2;
  string status = 3;
  uint32 limit = 4;
}

// Очистка task-scoped scratchpad. Mutation: получает запись аудита.
message ClearTaskScratchpad {
  string task_id = 1;
}

// Принудительное сжатие текущей task-scoped сборки контекста. Долговременную
// память не меняет: для этого нужна отдельная policy-операция.
message SummarizeContextNow {
  string task_id = 1;
}

// Выставляет флаг pinned из 01.1. Pin повышает приоритет, но не гарантирует
// включение в контекст: при нехватке бюджета pinned item отбрасывается
// последним и с явной причиной.
message PinContextItem {
  string task_id = 1;
  string item_id = 2;
  bool pinned = 3;
}

// Чтение полного содержимого артефакта по locator с повторной policy-проверкой
// и сверкой content_hash.
message ReadContextArtifact {
  string task_id = 1;
  string locator = 2;
}

// ---------------------------------------------------------------------------
// Ambient listening (план 04.5). Транспорт для типов контракта 04.1
// (`evohime-listener-contract`), а не второй источник истины: набор значений
// повторяет `ListeningState`, `ListeningReason` и `ExtractionState` этого
// крейта, и расширяется только вместе с ним.
// ---------------------------------------------------------------------------

enum ListeningState {
  // Состояние неизвестно: листенер не ответил или ещё не поднялся. UI обязан
  // показать «проверка состояния», а не «выключено».
  LISTENING_STATE_UNKNOWN = 0;
  LISTENING_STATE_STOPPED = 1;
  LISTENING_STATE_STARTING = 2;
  LISTENING_STATE_LISTENING = 3;
  LISTENING_STATE_PAUSED_BY_USER = 4;
  LISTENING_STATE_PAUSED_BY_POLICY = 5;
  LISTENING_STATE_DEVICE_CONFLICT = 6;
  LISTENING_STATE_DEVICE_DISCONNECTED = 7;
  LISTENING_STATE_ENGINE_UNAVAILABLE = 8;
  LISTENING_STATE_DENIED = 9;
}

enum ListeningReason {
  LISTENING_REASON_UNKNOWN = 0;
  LISTENING_REASON_USER_REQUEST = 1;
  LISTENING_REASON_QUIET_HOURS = 2;
  LISTENING_REASON_BLOCKLIST = 3;
  LISTENING_REASON_STOP_WORD = 4;
  LISTENING_REASON_PERMISSION_DENIED = 5;
  LISTENING_REASON_DEVICE_CONFLICT = 6;
  LISTENING_REASON_DEVICE_DISCONNECTED = 7;
  LISTENING_REASON_ENGINE_UNAVAILABLE = 8;
  LISTENING_REASON_ENGINE_DEGRADED = 9;
  LISTENING_REASON_SYSTEM_SLEEP = 10;
  LISTENING_REASON_STORAGE_FAILED = 11;
}

enum ExtractionState {
  EXTRACTION_STATE_UNKNOWN = 0;
  EXTRACTION_STATE_DISABLED = 1;
  EXTRACTION_STATE_PENDING = 2;
  EXTRACTION_STATE_DONE = 3;
  EXTRACTION_STATE_FAILED = 4;
}

// Одно устройство захвата. Отображаемое имя ограничено по длине: список
// приходит из системы и не обязан быть коротким.
message AmbientDevice {
  string device_id = 1;
  string display_name = 2;
  bool is_default = 3;
  bool is_active = 4;
}

// Строка списка эпизодов. Текста здесь нет и не будет: он отдаётся только
// `GetAmbientEpisode` по явному запросу пользователя.
message AmbientEpisodeSummary {
  string episode_id = 1;
  int64 started_at_ms = 2;
  int64 speech_duration_ms = 3;
  int32 utterance_count = 4;
  ExtractionState extraction_state = 5;
}

// Одно распознанное высказывание. Единственное место контракта, где текст
// пересекает границу IPC.
message Utterance {
  string utterance_id = 1;
  int64 started_at_ms = 2;
  int64 duration_ms = 3;
  string text = 4;
  string language = 5;
  bool redacted = 6;
}

// Полуоткрытое окно тишины [start_minute, end_minute) в локальных минутах
// суток; окно может пересекать полночь.
message QuietHours {
  int32 start_minute = 1;
  int32 end_minute = 2;
}

message AmbientPolicy {
  repeated QuietHours quiet_hours = 1;
  repeated string blocklist_patterns = 2;
  int32 retention_days = 3;
  // Отдельно от blocklist_patterns: шаблон процесса и шаблон заголовка окна
  // проверяются по разным строкам, и склеивание их в один список стирало бы
  // разницу между «блокировать zoom.exe» и «блокировать окно с таким текстом».
  repeated string window_title_blocklist = 4;
  // Голосовые команды («Ева, открой …»). Поля добавлены после первой версии
  // сообщения, поэтому старый клиент их просто не шлёт, а Core подставляет
  // сохранённое значение вместо того, чтобы молча выключить настройку.
  optional bool voice_commands = 5;
  optional bool voice_commands_autorun = 6;
}

// enabled=false → Stopped; enabled=true, paused=true → PausedByUser;
// enabled=true, paused=false → запуск или продолжение. `device_id` меняет
// устройство только после проверки capability и политики.
message SetAmbientListening {
  bool enabled = 1;
  bool paused = 2;
  string device_id = 3;
}

message SetAmbientListeningResult {
  ListeningState state = 1;
  string error_code = 2;
}

message GetAmbientStatus {}

message AmbientStatus {
  ListeningState state = 1;
  ListeningReason reason = 2;
  string active_device_id = 3;
  string engine_version = 4;
  bool engine_ready = 5;
  repeated AmbientDevice devices = 6;
}

message ListAmbientEpisodes {
  int64 since_ms = 1;
  int32 limit = 2;
  string cursor = 3;
}

message AmbientEpisodeList {
  repeated AmbientEpisodeSummary episodes = 1;
  string next_cursor = 2;
}

message GetAmbientEpisode {
  string episode_id = 1;
}

message AmbientEpisodeDetail {
  string episode_id = 1;
  repeated Utterance utterances = 2;
}

// `confirmed` обязателен и для `all=true`, и для списка идентификаторов: Core
// отвергает неподтверждённое удаление, поэтому модальное окно оболочки не
// является единственной границей безопасности.
message DeleteAmbientTranscripts {
  repeated string episode_ids = 1;
  bool all = 2;
  bool confirmed = 3;
}

message DeleteAmbientTranscriptsResult {
  int32 deleted_count = 1;
}

message ForgetAmbientWindow {
  int64 window_ms = 1;
  bool confirmed = 2;
}

message ForgetAmbientWindowResult {
  int32 deleted_count = 1;
}

message GetAmbientPolicy {}

message SaveAmbientPolicy {
  AmbientPolicy policy = 1;
}

message SaveAmbientPolicyResult {
  bool applied = 1;
  string error_code = 2;
}

// Решение пользователя по ограниченному предложению (этап 04.7).
//
// `idempotency_key` обязателен: принятие создаёт задачу через штатный
// dedup-путь Core, и без ключа двойной клик по карточке породил бы две
// задачи. По тому же образцу он есть у `ConfirmMemory`.
//
// `mute` — третий исход помимо «принять» и «отклонить»: «больше не
// предлагать такое». Он идёт по ключу без времени, поэтому переживает и смену
// временной корзины, и перезапуск Core.
message ResolveAmbientProposal {
  string proposal_id = 1;
  bool accepted = 2;
  string idempotency_key = 3;
  bool mute = 4;
}

message ResolveAmbientProposalResult {
  bool applied = 1;
  string state = 2;
  string task_id = 3;
  string error_code = 4;
}

// Одна карточка предложения. Человекочитаемый текст приходит только этой
// командой: durable journal его не несёт (см. `ambient.proposal`).
message AmbientProposalSummary {
  string proposal_id = 1;
  string kind = 2;
  string subject = 3;
  string title = 4;
  string source_episode_id = 5;
  int64 created_at_ms = 6;
  int64 expires_at_ms = 7;
  int32 occurrences = 8;
  string state = 9;
}

message ListAmbientProposals {
  int32 limit = 1;
}

message AmbientProposalList {
  repeated AmbientProposalSummary proposals = 1;
  int32 max_per_hour = 2;
  int32 max_per_day = 3;
  int64 min_interval_ms = 4;
}

// Одна услышанная команда, ждущая решения.
//
// Заголовок приложения приходит только этой командой: durable journal несёт
// лишь `app_id` (см. `ambient.voice_command`), потому что событие обязано
// оставаться списком опознанных ключей, а не пересказом сказанного.
message VoiceCommandSummary {
  string command_id = 1;
  string kind = 2;
  string app_id = 3;
  string title = 4;
  int64 created_at_ms = 5;
  int64 expires_at_ms = 6;
}

message ListVoiceCommands {
  int32 limit = 1;
}

message VoiceCommandList {
  repeated VoiceCommandSummary commands = 1;
  // Требуется ли клик. `false` — пользователь разрешил автозапуск, и очередь
  // в норме пуста: команда выполняется сразу.
  bool requires_confirmation = 2;
}

// Решение пользователя по услышанной команде. `accepted=false` — отказ;
// повторное решение по тому же `command_id` ничего не меняет, потому что
// команда снимается с очереди первым же решением.
message ResolveVoiceCommand {
  string command_id = 1;
  bool accepted = 2;
}

message ResolveVoiceCommandResult {
  bool launched = 1;
  string state = 2;
  string app_id = 3;
  string error_code = 4;
}

// --- Workflow orchestration (plan 06.3) -----------------------------------
//
// Every workflow command is additive: an older client that does not know them
// keeps negotiating the same major version and simply never sends them. The
// renderer never plans or executes anything -- it asks Core for a bounded
// projection and resolves node approvals through the existing ResolveApproval
// command, not a workflow-specific one.

message ListWorkflowTemplates {}

message GetWorkflowDefinition {
  string template_id = 1;
}

// Bounded string input of a workflow template. Values are substituted into
// free text only; capability identities never come from here.
message WorkflowInput {
  string name = 1;
  string value = 2;
}

message StartWorkflow {
  string template_id = 1;
  string task_id = 2;
  string workspace_path = 3;
  repeated WorkflowInput inputs = 4;
  // Repeating the same key returns the first run instead of starting a second.
  string idempotency_key = 5;
}

message GetWorkflowRun {
  string run_id = 1;
}

message CancelWorkflow {
  string run_id = 1;
}

message ListWorkflowEvents {
  string run_id = 1;
  int64 after_sequence = 2;
  int32 limit = 3;
}

// --- Automation scheduler (plan 18.1) -------------------------------------
// Additive commands. Core owns schedule validation, persistence and trigger
// idempotency; the renderer receives only bounded projections.

message ListAutomationSchedules {
  string owner_scope = 1;
  uint32 limit = 2;
}

message SaveAutomationSchedule {
  string schedule_id = 1;
  string definition_id = 2;
  uint64 revision = 3;
  string owner_scope = 4;
  uint32 hour = 5;
  uint32 minute = 6;
  sint32 timezone_minutes = 7;
  int64 missed_grace_ms = 8;
  bool enabled = 9;
}

// Core-owned durable Goal. The workspace path is an input-only scope selector;
// projections contain only its stable hashed workspace_id. No prompt,
// credentials, capabilities or hidden model reasoning cross this boundary.
message GoalCriterionInput {
  string id = 1;
  string kind = 2;
  string statement = 3;
}

message CreateGoal {
  string goal_id = 1;
  string workspace_path = 2;
  string chat_id = 3;
  string objective = 4;
  repeated GoalCriterionInput success_criteria = 5;
  uint64 token_budget = 6;
  uint64 cost_budget_micros = 7;
  uint64 continuation_budget = 8;
  string idempotency_key = 9;
}

message GetGoal { string goal_id = 1; }

message ListGoals {
  string workspace_path = 1;
  uint32 limit = 2;
}

message GoalAction {
  string goal_id = 1;
  uint64 expected_version = 2;
  string idempotency_key = 3;
}

message UpdateGoal {
  string goal_id = 1;
  uint64 expected_version = 2;
  string objective = 3;
  repeated GoalCriterionInput success_criteria = 4;
  string idempotency_key = 5;
}

message VerifyGoalCriterion {
  string goal_id = 1;
  uint64 expected_version = 2;
  string criterion_id = 3;
  // Evidence is Core-owned. Client-supplied evidence/verifier fields from an
  // early draft are intentionally reserved so a renderer cannot self-attest.
  reserved 4 to 6;
  string idempotency_key = 7;
}

message LinkGoalReference {
  string goal_id = 1;
  uint64 expected_version = 2;
  string kind = 3;
  string reference_id = 4;
  string idempotency_key = 5;
}

// Core-owned Continuation Policy v1. The policy bytes are canonical contract
// bytes; Core validates and hashes them before persistence.
message SaveContinuationPolicy {
  bytes policy_json = 1;
  string owner_scope = 2;
  string actor = 3;
  string idempotency_key = 4;
}

message StartContinuationRun {
  string run_id = 1;
  string policy_id = 2;
  uint64 policy_revision = 3;
  string owner_scope = 4;
  string goal_id = 5;
  uint64 goal_version = 6;
  string idempotency_key = 7;
  string task_id = 8;
}

message GetContinuationRun { string run_id = 1; }

message StopContinuation {
  string run_id = 1;
  string expected_state = 2;
  string idempotency_key = 3;
}

message PauseContinuation {
  string run_id = 1;
  string expected_state = 2;
  string idempotency_key = 3;
}

message ResumeContinuation {
  string run_id = 1;
  string expected_state = 2;
  string idempotency_key = 3;
}

message ContinuationProjection {
  uint32 schema_version = 1;
  string run_id = 2;
  string owner_scope = 3;
  string policy_id = 4;
  uint64 policy_revision = 5;
  string policy_hash = 6;
  string state = 7;
  uint64 continuation_index = 8;
  uint64 max_continuations = 9;
  uint64 model_turns = 10;
  uint64 max_model_turns = 11;
  uint64 token_used = 12;
  uint64 cost_used_micros = 13;
  string stop_reason = 14;
  string error_code = 15;
  repeated ContinuationGateProjection gates = 16;
}

message ContinuationGateProjection {
  string gate_id = 1;
  string kind = 2;
  string capability_ref = 3;
  string status = 4;
  string evidence_ref = 5;
  string error_code = 6;
}

message ContinuationActionResult {
  uint32 schema_version = 1;
  string run_id = 2;
  string action = 3;
  bool applied = 4;
  bool deduplicated = 5;
  string error_code = 6;
}

message GoalCriterionProjection {
  string id = 1;
  string kind = 2;
  string statement = 3;
  string status = 4;
  string evidence_ref = 5;
  string verifier_id = 6;
  string verifier_version = 7;
  int64 verified_at_ms = 8;
  string provenance = 9;
}

message GoalProjection {
  uint32 schema_version = 1;
  string goal_id = 2;
  uint64 version = 3;
  string workspace_id = 4;
  string chat_id = 5;
  string objective = 6;
  repeated GoalCriterionProjection success_criteria = 7;
  string status = 8;
  string progress_summary = 9;
  repeated string completed_criteria = 10;
  repeated string remaining_criteria = 11;
  repeated string blockers = 12;
  string next_action = 13;
  repeated string workflow_run_ids = 14;
  repeated string child_run_ids = 15;
  string checkpoint_id = 16;
  uint64 token_budget = 17;
  uint64 cost_budget_micros = 18;
  uint64 continuation_budget = 19;
  int64 created_at_ms = 20;
  int64 updated_at_ms = 21;
  string content_hash = 22;
  string recovery_warning = 23;
  string error_code = 24;
}

message GoalListProjection {
  uint32 schema_version = 1;
  repeated GoalProjection goals = 2;
  string error_code = 3;
  bool truncated = 4;
}

message GoalActionResult {
  uint32 schema_version = 1;
  string goal_id = 2;
  string action = 3;
  bool applied = 4;
  bool deduplicated = 5;
  uint64 goal_version = 6;
  string error_code = 7;
  string error_message = 8;
  int64 sequence_id = 9;
  GoalProjection goal = 10;
}

message TriggerAutomation {
  string definition_id = 1;
  uint64 revision = 2;
  string owner_scope = 3;
  string trigger_key = 4;
  string input_json = 5;
  string correlation_id = 6;
  string idempotency_key = 7;
}

message ListAutomationRuns {
  string owner_scope = 1;
  string definition_id = 2;
  uint32 limit = 3;
}

message GetAutomationRun {
  string run_id = 1;
}

message ListAutomationEvents {
  string run_id = 1;
  int64 after_sequence = 2;
  int32 limit = 3;
}

message CancelAutomationRun {
  string run_id = 1;
}

message SetAutomationScheduleEnabled {
  string schedule_id = 1;
  bool enabled = 2;
}

