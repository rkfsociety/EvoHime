message CoreInfo {
  ProtocolVersion protocol = 1;
  string core_version = 2;
  string build_revision = 3;
  string runtime_revision = 4;
  repeated string capabilities = 5;
  repeated string feature_flags = 6;
  uint32 max_frame_bytes = 7;
  uint32 max_replay_events = 8;
  uint32 max_snapshot_bytes = 9;
}

message Ready {
  ProtocolVersion protocol = 1;
  string core_version = 2;
  CoreInfo core_info = 3;
}

message EventEnvelope {
  ProtocolVersion protocol = 1;
  uint64 sequence_id = 2;
  string task_id = 3;
  string event_type = 4;
  bytes payload = 5;
  string core_instance_id = 6;
  uint64 session_epoch = 7;
  oneof event {
    Ready ready = 10;
    ReplayGap replay_gap = 11;
    FullSnapshot full_snapshot = 12;
    AuthChallenge auth_challenge = 13;
    ExecutionEvent execution_event = 14;
    TaskCheckpointProjection task_checkpoint = 15;
    TaskCheckpointActionResult task_checkpoint_action_result = 16;
    SkillCatalogProjection skill_catalog = 17;
    SkillContentResult skill_content = 18;
    SkillReferenceResult skill_reference = 19;
    GoalProjection goal = 20;
    GoalListProjection goal_list = 21;
    GoalActionResult goal_action = 22;
    ContinuationProjection continuation = 23;
    ContinuationActionResult continuation_action = 24;
  }
}

// Bounded typed execution-ledger projection (план 08-1/08-2/08-3). Общие
// correlation-поля отражают execution_ledger::ExecutionEventV1 один в один;
// body остаётся каноническим JSON (evohime_local_storage::execution_ledger
// — источник истины для вариантов), чтобы не дублировать typed oneof body
// сразу в трёх схемах (Rust/proto/TS) при уже bounded и versioned payload.
message ExecutionEvent {
  uint32 schema_version = 1;
  string event_id = 2;
  string run_scope = 3;
  string run_id = 4;
  string session_id = 5;
  int64 created_at_ms = 6;
  string state_after = 7;
  string action_id = 8;
  string tool_call_id = 9;
  string observation_id = 10;
  string receipt_id = 11;
  string failure_id = 12;
  string workflow_run_id = 13;
  string node_id = 14;
  string attempt_id = 15;
  string effect_id = 16;
  string model_request_id = 17;
  bytes body_json = 18;
  bool secrets_present = 19;
  string redaction_digest = 20;
}

// The server emits this when the requested sequence is no longer retained.
// It is a diagnostic and does not contain unbounded event data.
message ReplayGap {
  uint64 requested_after_sequence = 1;
  uint64 earliest_available_sequence = 2;
  uint64 latest_available_sequence = 3;
  string reason = 4;
}

// Snapshot bytes are bounded by the desktop IPC frame limit. The receiver
// must reject a snapshot that does not fit before attempting to apply it.
message FullSnapshot {
  uint64 sequence_id = 1;
  bytes snapshot_json = 2;
}
