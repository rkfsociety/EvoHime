    ListResearchEvidence list_research_evidence = 37;
    CreateMemory create_memory = 38;
    ListMemory list_memory = 39;
    SearchMemory search_memory = 40;
    ArchiveMemory archive_memory = 41;
    ForgetMemory forget_memory = 42;
    InstallCapability install_capability = 43;
    ListCapabilities list_capabilities = 44;
    MatchCapabilities match_capabilities = 45;
    RemoveCapability remove_capability = 46;
    RequestChildHandoff request_child_handoff = 47;
    ListChildHandoffs list_child_handoffs = 48;
    SubmitChildRequest submit_child_request = 49;
    SubmitChildReport submit_child_report = 50;
    RunResearchFetch run_research_fetch = 51;
    ListWorkspace list_workspace = 52;
    ReadWorkspaceFile read_workspace_file = 53;
    GitStatus git_status = 54;
    GitDiff git_diff = 55;
    TerminalExecute terminal_execute = 56;
    ExportDoctorLogs export_doctor_logs = 57;
    GetCapabilitySelection get_capability_selection = 58;
    PinCapabilitySelection pin_capability_selection = 59;
    ReplaceCapabilitySelection replace_capability_selection = 60;
    SubmitFeedback submit_feedback = 61;
