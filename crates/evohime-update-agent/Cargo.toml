[package]
name = "evohime-update-agent"
version = "0.1.0"
publish = false
edition = "2021"

[lib]
name = "evohime_update_agent"
path = "src/lib.rs"

[[bin]]
name = "evohime-updater"
path = "src/main.rs"

[dependencies]
evohime_tx = { package = "evohime-updater", path = "../evohime-updater" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
[dev-dependencies]
tempfile = "3"
