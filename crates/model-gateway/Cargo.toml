[package]
name = "evohime-model-gateway"
version = "0.1.0"
publish = false
edition = "2021"

[dependencies]
async-stream = "0.3"
futures-util = "0.3"
hex = "0.4"
lru = "0.19"
parking_lot = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "query"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
