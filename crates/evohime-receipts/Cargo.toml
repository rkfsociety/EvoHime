[package]
name = "evohime-receipts"
version = "0.1.0"
edition = "2021"

[dependencies]
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v7"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security", "Win32_System_Memory"] }

[dev-dependencies]
hex = "0.4"

[build-dependencies]
serde_json = "1"

[[bin]]
name = "evohime-verify"
path = "src/bin/evohime-verify.rs"
