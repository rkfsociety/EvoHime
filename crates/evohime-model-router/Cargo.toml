[package]
name = "evohime-model-router"
version = "0.1.0"
publish = false
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "evohime-model-router"
path = "src/main.rs"

[dependencies]
evohime-service-contract = { path = "../evohime-service-contract" }
hex = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi"] }
