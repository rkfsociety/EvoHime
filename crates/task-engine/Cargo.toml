[package]
name = "evohime-task-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
evohime-protocol = { path = "../protocol" }
evohime-storage = { path = "../storage" }
sqlx = { version = "0.8", features = [
  "postgres",
  "runtime-tokio-rustls",
  "chrono",
  "uuid",
] }
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
