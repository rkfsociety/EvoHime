[package]
name = "evohime-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = [
  "postgres",
  "runtime-tokio-rustls",
  "chrono",
  "json",
  "uuid",
] }
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
