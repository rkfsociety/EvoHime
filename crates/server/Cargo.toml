[package]
name = "evohime-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws", "json"] }
chrono = { version = "0.4", features = ["serde"] }
evohime-agent-runtime = { path = "../agent-runtime" }
evohime-model-gateway = { path = "../model-gateway" }
evohime-permissions = { path = "../permissions" }
evohime-protocol = { path = "../protocol" }
evohime-storage = { path = "../storage" }
evohime-task-engine = { path = "../task-engine" }
evohime-tool-runtime = { path = "../tool-runtime" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
  "postgres",
  "runtime-tokio-rustls",
  "chrono",
  "json",
  "uuid",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "net", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
