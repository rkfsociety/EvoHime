[package]
name = "evohime-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
axum = { version = "0.7", features = ["ws", "json", "multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.17.0"
evohime-agent-runtime = { path = "../agent-runtime" }
evohime-memory = { path = "../memory" }
evohime-model-gateway = { path = "../model-gateway" }
evohime-permissions = { path = "../permissions" }
evohime-protocol = { path = "../protocol" }
evohime-storage = { path = "../storage" }
evohime-task-engine = { path = "../task-engine" }
evohime-tool-runtime = { path = "../tool-runtime" }
futures-util = "0.3"
opentelemetry = "0.30"
opentelemetry-otlp = { version = "0.30", features = ["http-proto", "reqwest-rustls", "trace"] }
opentelemetry_sdk = { version = "0.30", package = "opentelemetry_sdk", features = ["rt-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
sqlx = { version = "0.8", features = [
  "postgres",
  "runtime-tokio-rustls",
  "chrono",
  "json",
  "uuid",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "net", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors", "set-header"] }
tracing = "0.1"
tracing-opentelemetry = "0.31"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
sqlx = { version = "0.8", features = [
  "postgres",
  "runtime-tokio-rustls",
  "chrono",
  "json",
  "uuid",
  "migrate",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "stream"] }
tokio-tungstenite = "0.23"
