[package]
name = "evohime-listener"
version = "0.1.0"
publish = false
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "evohime-listener"
path = "src/main.rs"

[dependencies]
evohime-listener-audio = { path = "../evohime-listener-audio" }
evohime-listener-contract = { path = "../evohime-listener-contract" }
evohime-listener-ipc = { path = "../evohime-listener-ipc" }
evohime-desktop-ipc = { path = "../desktop-ipc" }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
