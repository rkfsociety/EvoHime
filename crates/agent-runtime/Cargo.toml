[package]
name = "evohime-agent-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
evohime-memory = { path = "../memory" }
evohime-model-gateway = { path = "../model-gateway" }
evohime-permissions = { path = "../permissions" }
evohime-protocol = { path = "../protocol" }
evohime-project-index = { path = "../project-index" }
evohime-tool-runtime = { path = "../tool-runtime" }
futures-util = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }

[dev-dependencies]
evohime-model-gateway = { path = "../model-gateway" }
evohime-permissions = { path = "../permissions" }
futures-util = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
