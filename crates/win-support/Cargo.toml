[package]
name = "evohime-win-support"
version = "0.1.0"
edition = "2021"

[lib]
name = "evohime_win_support"
path = "src/lib.rs"

[dependencies]
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
] }

[dev-dependencies]
tempfile = "3"
