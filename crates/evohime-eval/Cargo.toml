[package]
name = "evohime-eval"
version = "0.1.0"
publish = false
edition = "2021"

[[bin]]
name = "evohime-eval"
path = "src/main.rs"

[dependencies]
evohime-core = { path = "../evohime-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
walkdir = "2"
