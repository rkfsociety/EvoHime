[package]
name = "evohime-supervisor"
version = "0.1.0"
publish = false
edition = "2021"

[[bin]]
name = "evohime-supervisor"
path = "src/main.rs"

[[bin]]
name = "evohime-analysis-worker"
path = "src/analysis_worker_main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "time"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
evohime-updater = { path = "../evohime-updater" }
evohime-desktop-ipc = { path = "../desktop-ipc" }
evohime-receipts = { path = "../evohime-receipts" }
rand = "0.8"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
