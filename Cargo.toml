[workspace]
members = [
  "crates/context-budget",
  "crates/permissions",
  "crates/tool-runtime",
  "crates/model-gateway",
  "crates/evohime-core",
  "crates/evohime-hive-contract",
  "crates/evohime-hive",
  "crates/evohime-local-storage",
  "crates/evohime-listener-contract",
  "crates/evohime-listener-audio",
  "crates/evohime-listener-ipc",
  "crates/evohime-listener",
  "crates/evohime-supervisor",
  "crates/evohime-updater",
  "crates/evohime-update-agent",
  "crates/desktop-ipc",
  "crates/test-stub-exitcode",
  "crates/evohime-eval",
  "crates/evohime-evals-service",
  "crates/evohime-media-voice",
  "crates/evohime-research",
  "crates/evohime-ambient",
  "crates/evohime-computer-use",
  "crates/evohime-workflow",
  "crates/evohime-rag-memory",
  "crates/evohime-tools-workspace",
  "crates/evohime-tools-exec",
  "crates/evohime-model-adapters",
  "crates/evohime-model-router",
  "crates/evohime-receipts",
  "crates/evohime-model-provenance",
  "crates/evohime-remote",
  "crates/evohime-service-contract",
  "crates/evohime-cli-protocol",
  "crates/evohime-cli",
  "crates/evohime-cli-contract",
]
resolver = "2"

[workspace.dependencies]
tokio = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
